version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Move the Python version on purpose, never by PR. Patch releases still arrive:
      # the tag floats and build.yml rebuilds every Sunday.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # numpy 2.6 is blocked by numba 0.68.1 (needs numpy < 2.6). Take it with a numba bump.
      - dependency-name: "numpy"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]