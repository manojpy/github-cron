name: 🗄️ Archive Outcome Streams

on:
  schedule:
    - cron: "30 18 * * *"   # 18:30 UTC = 00:00 IST — once daily, off the bot's own cron
  workflow_dispatch:

permissions:
  contents: write   # needs write, unlike analyze-confluence.yml, to commit the archive
  pull-requests: write  # needed to create PR

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet -r requirements.txt

      - name: 🗄️ Export new outcomes since last run
        id: export
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: |
          set +e
          python3 src/export_outcomes.py --data-dir data/outcomes \
            2>&1 | tee export_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          {
            echo "## 🗄️ Outcome Archive Export"
            echo '```'; cat export_output.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: ⚠️ Fail on real error
        if: steps.export.outputs.exit_code != '0'
        run: exit 1

      - name: 📦 Commit and create PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          BRANCH_NAME="archive/outcomes-${{ github.run_id }}"
          git checkout -b "$BRANCH_NAME"
          
          git add data/outcomes/
          if git diff --cached --quiet; then
            echo "No archive changes to commit."
            exit 0
          fi
          
          git commit -m "chore: archive outcome streams $(date -u +%Y-%m-%d)"
          git push -u origin "$BRANCH_NAME"
          
          # Create PR if one doesn't already exist
          if gh pr view "$BRANCH_NAME" --json number --jq .number 2>/dev/null; then
            echo "PR already exists for $BRANCH_NAME"
          else
            gh pr create \
              --title "📦 Archive outcome streams $(date -u +%Y-%m-%d)" \
              --body "Automated archive of outcome_log_stream and shadow_log_stream data." \
              --base main \
              --head "$BRANCH_NAME"
          fi