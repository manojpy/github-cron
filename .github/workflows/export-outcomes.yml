name: 🗄️ Archive Outcome Streams

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet -r requirements.txt

      - name: 📦 Clone data repository
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          git clone \
            "https://oauth2:${DATA_REPO_TOKEN}@github.com/manojpy/outcome-data.git" \
            /tmp/data-repo

      - name: 🗄️ Export new outcomes since last run
        id: export
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: |
          set +e
          python3 src/export_outcomes.py --data-dir /tmp/data-repo \
            2>&1 | tee export_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          {
            echo "## 🗄️ Outcome Archive Export"
            echo '```'; cat export_output.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: ⚠️ Fail on real error
        if: steps.export.outputs.exit_code != '0'
        run: exit 1

      - name: 🧹 Cleanup old archives
        run: |
          python3 src/cleanup_outcomes.py \
            --data-dir /tmp/data-repo \
            --max-age-days 90 \
            --max-size-mb 100 \
            --max-total-mb 400

      - name: 📦 Commit and push to data repository
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          cd /tmp/data-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "chore: archive outcome streams $(date -u +%Y-%m-%d)"
          git push origin main
