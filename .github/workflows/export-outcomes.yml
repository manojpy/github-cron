name: 🗄️ Archive Outcome Streams

on:
  schedule:
    - cron: "30 18 * * *"   # 18:30 UTC = 00:00 IST — once daily, off the bot's own cron
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet -r requirements.txt

      - name: 🗄️ Export new outcomes since last run
        id: export
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: |
          set +e
          python3 src/export_outcomes.py --data-dir src/data/outcomes \
            2>&1 | tee export_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          {
            echo "## 🗄️ Outcome Archive Export"
            echo '```'; cat export_output.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: ⚠️ Fail on real error
        if: steps.export.outputs.exit_code != '0'
        run: exit 1

      - name: 🧹 Cleanup old archives
        run: |
          python3 src/cleanup_outcomes.py \
            --data-dir src/data/outcomes \
            --max-age-days 90 \
            --max-size-mb 100 \
            --max-total-mb 400

      - name: 📦 Push to data repository
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Clone data repo
          git clone https://oauth2:${DATA_REPO_TOKEN}@github.com/manojpy/outcome-data.git /tmp/data-repo
          
          # Copy archive files
          mkdir -p /tmp/data-repo/outcome /tmp/data-repo/shadow
          cp src/data/outcomes/outcome/*.jsonl /tmp/data-repo/outcome/ 2>/dev/null || true
          cp src/data/outcomes/shadow/*.jsonl /tmp/data-repo/shadow/ 2>/dev/null || true
          
          # Copy state file
          cp src/data/outcomes/.state.json /tmp/data-repo/ 2>/dev/null || true
          
          # Commit and push
          cd /tmp/data-repo
          git add .
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "chore: archive outcome streams $(date -u +%Y-%m-%d)"
          git push origin main