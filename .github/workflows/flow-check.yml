name: 🔍 Flow check (one-off diagnostic)
on:
  workflow_dispatch:
    inputs:
      symbol:
        description: 'Delta symbol'
        required: true
        default: 'RIVERUSD'
      candle_open_ist:
        description: 'Candle OPEN time in IST, YYYY-MM-DD HH:MM (19:30 candle = 2026-10-14 19:30)'
        required: true
        default: '2026-10-14 19:30'

jobs:
  flow-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy requests
      - name: Compute flow on 300 / 600 / 1500-candle windows
        env:
          DELTA_API_BASE: ${{ secrets.DELTA_API_BASE }}
        run: python tools/flow_check.py "${{ inputs.symbol }}" "${{ inputs.candle_open_ist }}"