name: 🧹 Cleanup Outcome Archives

on:
  schedule:
    - cron: "0 2 * * *"   # Every day at 2 AM UTC
  workflow_dispatch:
    inputs:
      wipe_all:
        description: '🚨 Wipe ALL outcomes/ + reports/ data (ignores age/size limits)'
        required: false
        default: false
        type: boolean

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 📦 Clone data repository
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          git clone \
            "https://oauth2:${DATA_REPO_TOKEN}@github.com/manojpy/outcome-data.git" \
            /tmp/data-repo

      - name: 🧹 Cleanup old archives
        env:
          WIPE_ALL: ${{ inputs.wipe_all }}
        run: |
          if [ "$WIPE_ALL" == "true" ]; then
            echo "🚨 WIPE ALL requested — deleting all outcomes/ and reports/ data"
            python3 src/cleanup_outcomes.py --data-dir /tmp/data-repo --wipe-all
          else
            python3 src/cleanup_outcomes.py \
              --data-dir /tmp/data-repo \
              --max-age-days 185 \
              --max-size-mb 100 \
              --max-total-mb 400 \
              --no-compress-within-days 30
          fi

      - name: 📤 Commit and push cleanup
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          cd /tmp/data-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: cleanup old outcomes $(date -u +%Y-%m-%d)"

          # The alert workflow pushes to this repo every 15 minutes. If it landed
          # after our clone, a plain push is rejected — rebase and retry.
          for attempt in 1 2 3 4 5; do
            if git push origin main; then
              echo "✅ Cleanup pushed (attempt ${attempt})"
              exit 0
            fi
            echo "::warning::Push rejected (attempt ${attempt}/5) — rebasing onto latest main"
            sleep $(( attempt * 2 + RANDOM % 3 ))
            if ! git pull --rebase --no-tags origin main; then
              echo "::error::Rebase conflict — aborting; cleanup NOT pushed"
              git rebase --abort 2>/dev/null || true
              exit 1
            fi
          done
          echo "::error::Could not push cleanup after 5 attempts"
          exit 1
