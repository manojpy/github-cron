name: 🧹 Cleanup Outcome Archives

on:
  workflow_dispatch:
    inputs:
      wipe_all:
        description: '🚨 Wipe ALL outcomes/ + shadow/ + reports/ data (ignores age/size limits)'
        required: false
        default: false
        type: boolean
      squash_history:
        description: '🗜 Squash outcome-data git history into one commit (run only when no bot run is active)'
        required: false
        default: false
        type: boolean
      confirm:
        description: 'Type CONFIRM to allow wipe_all or squash_history (ignored for routine cleanup)'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read   # the guard step lists bot runs

concurrency:
  group: cleanup-outcomes
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 🛑 Guard destructive options
        env:
          WIPE_ALL: ${{ inputs.wipe_all }}
          SQUASH_HISTORY: ${{ inputs.squash_history }}
          CONFIRM: ${{ inputs.confirm }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$WIPE_ALL" != "true" ] && [ "$SQUASH_HISTORY" != "true" ]; then
            echo "Routine cleanup - no guard needed."
            exit 0
          fi
          if [ "$CONFIRM" != "CONFIRM" ]; then
            echo "::error::wipe_all / squash_history need the 'confirm' input set to exactly CONFIRM"
            exit 1
          fi
          ACTIVE=$(gh run list --workflow run-bot.yml --json status \
            --jq '[.[] | select(.status == "in_progress" or .status == "queued")] | length')
          if [ "$ACTIVE" != "0" ]; then
            echo "::error::${ACTIVE} bot run(s) active or queued - they push to the same data repo. Retry between runs."
            exit 1
          fi
          echo "Guard passed"

      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: 📦 Clone data repository
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          set -euo pipefail

          ASKPASS="$RUNNER_TEMP/git-askpass.sh"
          trap 'rm -f "$ASKPASS"' EXIT

          cat > "$ASKPASS" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$DATA_REPO_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$ASKPASS"

          export GIT_ASKPASS="$ASKPASS"
          export GIT_TERMINAL_PROMPT=0

          git clone --depth 1 \
            "https://github.com/manojpy/outcome-data.git" \
            /tmp/data-repo
          echo '*.jsonl merge=union' >> /tmp/data-repo/.git/info/attributes

      - name: 🧹 Cleanup old archives
        env:
          WIPE_ALL: ${{ inputs.wipe_all }}
        run: |
          if [ "$WIPE_ALL" == "true" ]; then
            echo "🚨 WIPE ALL requested — deleting all outcomes/ and reports/ data"
            python3 src/cleanup_outcomes.py --data-dir /tmp/data-repo --wipe-all
          else
            python3 src/cleanup_outcomes.py \
              --data-dir /tmp/data-repo \
              --max-age-days 185 \
              --reports-max-age-days 7 \
              --max-size-mb 100 \
              --max-total-mb 400 \
              --no-compress-within-days 30
          fi

      - name: 📤 Commit and push cleanup
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          set -euo pipefail
          cd /tmp/data-repo

          ASKPASS="$RUNNER_TEMP/git-askpass.sh"
          trap 'rm -f "$ASKPASS"' EXIT

          cat > "$ASKPASS" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$DATA_REPO_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$ASKPASS"

          export GIT_ASKPASS="$ASKPASS"
          export GIT_TERMINAL_PROMPT=0

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: cleanup old outcomes $(date -u +%Y-%m-%d)"

          # The alert workflow pushes every 15 minutes. If it pushed after
          # our clone, rebase onto the latest main and retry.
          for attempt in 1 2 3 4 5; do
            if git push origin main; then
              echo "✅ Cleanup pushed (attempt ${attempt})"
              exit 0
            fi

            if [ "$attempt" -eq 5 ]; then
              break
            fi

            echo "::warning::Push rejected (attempt ${attempt}/5) — rebasing onto latest main"
            sleep $(( attempt * 2 + RANDOM % 3 ))

            if ! git pull --rebase --no-tags origin main; then
              echo "::error::Rebase conflict — aborting; cleanup NOT pushed"
              git rebase --abort 2>/dev/null || true
              exit 1
            fi
          done

          echo "::error::Could not push cleanup after 5 attempts"
          exit 1

      - name: 🗜 Squash git history (manual only)
        if: inputs.squash_history == true
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          set -euo pipefail
          cd /tmp/data-repo

          ASKPASS="$RUNNER_TEMP/git-askpass.sh"
          trap 'rm -f "$ASKPASS"' EXIT

          cat > "$ASKPASS" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$DATA_REPO_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$ASKPASS"

          export GIT_ASKPASS="$ASKPASS"
          export GIT_TERMINAL_PROMPT=0

          git checkout --orphan squashed
          git add -A
          git commit -m "chore: squash history $(date -u +%Y-%m-%d)"

          # Use the token-free origin URL. This operation intentionally
          # force-pushes main and must remain manual-only.
          git push --force origin squashed:main