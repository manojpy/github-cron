name: 🧹 Cleanup Outcome Archives

on:
  workflow_dispatch:
    inputs:
      wipe_all:
        description: '🚨 Wipe ALL outcomes/ + shadow/ + reports/ data (ignores age/size limits)'
        required: false
        default: false
        type: boolean
      squash_history:
        description: '🗜 Squash outcome-data git history into one commit (run only when no bot run is active)'
        required: false
        default: false
        type: boolean
      clear_redis:
        description: '🧹 Clear outcomes + Brain-derived Redis state (keeps config, weights, kill switch). Needs CONFIRM'
        required: false
        default: false
        type: boolean
      clear_kill_switch:
        description: '🔓 Clear Kill Switch (manual override after review)'
        required: false
        default: false
        type: boolean
      confirm:
        description: 'Type CONFIRM to allow wipe_all, squash_history or clear_redis (ignored otherwise)'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read   # the guard step lists bot runs

concurrency:
  group: cleanup-outcomes
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 🛑 Guard destructive options
        env:
          WIPE_ALL: ${{ inputs.wipe_all }}
          SQUASH_HISTORY: ${{ inputs.squash_history }}
          CONFIRM: ${{ inputs.confirm }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$WIPE_ALL" != "true" ] && [ "$SQUASH_HISTORY" != "true" ]; then
            echo "Routine cleanup - no guard needed."
            exit 0
          fi
          if [ "$CONFIRM" != "CONFIRM" ]; then
            echo "::error::wipe_all / squash_history need the 'confirm' input set to exactly CONFIRM"
            exit 1
          fi
          ACTIVE=$(gh run list --workflow run-bot.yml --json status \
            --jq '[.[] | select(.status == "in_progress" or .status == "queued")] | length')
          if [ "$ACTIVE" != "0" ]; then
            echo "::error::${ACTIVE} bot run(s) active or queued - they push to the same data repo. Retry between runs."
            exit 1
          fi
          echo "Guard passed"

      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: 📦 Clone data repository
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          set -euo pipefail

          ASKPASS="$RUNNER_TEMP/git-askpass.sh"
          trap 'rm -f "$ASKPASS"' EXIT

          cat > "$ASKPASS" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$DATA_REPO_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$ASKPASS"

          export GIT_ASKPASS="$ASKPASS"
          export GIT_TERMINAL_PROMPT=0

          git clone --depth 1 \
            "https://github.com/manojpy/outcome-data.git" \
            /tmp/data-repo
          echo '*.jsonl merge=union' >> /tmp/data-repo/.git/info/attributes

      - name: 🧹 Cleanup old archives
        env:
          WIPE_ALL: ${{ inputs.wipe_all }}
        run: |
          if [ "$WIPE_ALL" == "true" ]; then
            echo "🚨 WIPE ALL requested — deleting all outcomes/ and reports/ data"
            python3 src/cleanup_outcomes.py --data-dir /tmp/data-repo --wipe-all
          else
            python3 src/cleanup_outcomes.py \
              --data-dir /tmp/data-repo \
              --max-age-days 185 \
              --reports-max-age-days 7 \
              --max-size-mb 100 \
              --max-total-mb 400 \
              --no-compress-within-days 30
          fi

      - name: 📤 Commit and push cleanup
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          set -euo pipefail
          cd /tmp/data-repo

          ASKPASS="$RUNNER_TEMP/git-askpass.sh"
          trap 'rm -f "$ASKPASS"' EXIT

          cat > "$ASKPASS" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$DATA_REPO_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$ASKPASS"

          export GIT_ASKPASS="$ASKPASS"
          export GIT_TERMINAL_PROMPT=0

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: cleanup old outcomes $(date -u +%Y-%m-%d)"

          # The alert workflow pushes every 15 minutes. If it pushed after
          # our clone, rebase onto the latest main and retry.
          for attempt in 1 2 3 4 5; do
            if git push origin main; then
              echo "✅ Cleanup pushed (attempt ${attempt})"
              exit 0
            fi

            if [ "$attempt" -eq 5 ]; then
              break
            fi

            echo "::warning::Push rejected (attempt ${attempt}/5) — rebasing onto latest main"
            sleep $(( attempt * 2 + RANDOM % 3 ))

            if ! git pull --rebase --no-tags origin main; then
              echo "::error::Rebase conflict — aborting; cleanup NOT pushed"
              git rebase --abort 2>/dev/null || true
              exit 1
            fi
          done

          echo "::error::Could not push cleanup after 5 attempts"
          exit 1

      - name: 🗜 Squash git history (manual only)
        if: inputs.squash_history == true
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          set -euo pipefail
          cd /tmp/data-repo

          ASKPASS="$RUNNER_TEMP/git-askpass.sh"
          trap 'rm -f "$ASKPASS"' EXIT

          cat > "$ASKPASS" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$DATA_REPO_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$ASKPASS"

          export GIT_ASKPASS="$ASKPASS"
          export GIT_TERMINAL_PROMPT=0
          # Remember what main was when this job cloned it. If a bot run pushes
          # after that, the force-push below is refused instead of silently
          # deleting that run's outcomes.
          BASE=$(git rev-parse HEAD)

          git checkout --orphan squashed
          git add -A
          git commit -m "chore: squash history $(date -u +%Y-%m-%d)"

          # Use the token-free origin URL. This operation intentionally
          # force-pushes main and must remain manual-only.
          git push --force-with-lease=main:"$BASE" origin squashed:main

  # Redis maintenance (moved here from the 15-minute alert workflow). Its own job, so
  # the routine archive cleanup above is untouched and an alert run never carries it.
  maintenance:
    if: inputs.clear_redis == true || inputs.clear_kill_switch == true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}/macd-unified-aot
    steps:
      - name: 🛑 Guard Redis purge
        env:
          CLEAR_REDIS: ${{ inputs.clear_redis }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CLEAR_REDIS" = "true" ] && [ "$CONFIRM" != "CONFIRM" ]; then
            echo "::error::clear_redis needs the 'confirm' input set to exactly CONFIRM"
            exit 1
          fi
          echo "Guard passed"

      - name: 🔥 Checkout config only
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            config_macd.json
          sparse-checkout-cone-mode: false

      - name: 🐳 Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔥 Pull image
        run: |
          set -euo pipefail
          BASE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          IMAGE="$BASE:sha-${GITHUB_SHA}"
          if ! docker pull --quiet --platform linux/amd64 "$IMAGE"; then
            echo "::warning::No image for ${GITHUB_SHA} — falling back to :latest (it must already contain --clear-redis / --clear-kill-switch)"
            IMAGE="$BASE:latest"
            docker pull --quiet --platform linux/amd64 "$IMAGE"
          fi
          echo "RUN_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: 🧹 Run maintenance
        env:
          CLEAR_REDIS: ${{ inputs.clear_redis }}
          CLEAR_KILL_SWITCH: ${{ inputs.clear_kill_switch }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          DELTA_API_BASE: ${{ secrets.DELTA_API_BASE }}
        run: |
          ENV_FILE="$(pwd)/.bot_env"
          trap 'rm -f "$ENV_FILE"' EXIT
          {
            printf 'TELEGRAM_BOT_TOKEN=%s\n' "$TELEGRAM_BOT_TOKEN"
            printf 'TELEGRAM_CHAT_ID=%s\n' "$TELEGRAM_CHAT_ID"
            printf 'REDIS_URL=%s\n' "$REDIS_URL"
            printf 'DELTA_API_BASE=%s\n' "$DELTA_API_BASE"
            printf 'OUTCOME_DATA_DIR=%s\n' "/tmp/outcome-data"
            printf 'NUMERIC_SELFTEST_ENABLED=%s\n' "false"
          } > "$ENV_FILE"

          ARGS=""
          [ "$CLEAR_REDIS" = "true" ] && ARGS="$ARGS --clear-redis"
          [ "$CLEAR_KILL_SWITCH" = "true" ] && ARGS="$ARGS --clear-kill-switch"
          echo "🧰 Maintenance args:$ARGS"
          docker run --rm \
            --platform linux/amd64 \
            --security-opt=no-new-privileges \
            --read-only \
            --cap-drop=ALL \
            --pids-limit=256 \
            --memory=512m \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --tmpfs /home/appuser/.cache:rw,noexec,nosuid,size=32m \
            --env-file "$ENV_FILE" \
            -e PYTHONPATH=/app/src \
            -v "$(pwd)/config_macd.json:/app/src/config_macd.json:ro" \
            "${{ env.RUN_IMAGE }}" \
            python macd_unified.py $ARGS 