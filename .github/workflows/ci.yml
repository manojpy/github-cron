name: 🛑 CI Bot

on: [push, pull_request, workflow_dispatch]

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install linters
        run: pip install pyflakes==3.2.0 mypy==1.11.0
      - name: Syntax gate (py_compile everything)
        run: python -m compileall -q .
      - name: Pyflakes (BLOCKING on real errors only)
        # Blocks on undefined names — the class of bug that shipped the
        # logger regression. Unused imports / f-strings without placeholders
        # / unused locals are printed for visibility but are advisory until
        # the accumulated lint debt is paid down.
        run: |
          set +e
          OUTPUT=$(pyflakes . 2>&1)
          PYFLAKES_EXIT=$?
          set -e
          if [ "$PYFLAKES_EXIT" -eq 0 ]; then
            echo "✅ pyflakes clean"
            exit 0
          fi
          echo "── pyflakes findings ──────────────────────────"
          echo "$OUTPUT"
          echo "───────────────────────────────────────────────"
          BLOCKING=$(echo "$OUTPUT" | grep -E "undefined name" || true)
          if [ -n "$BLOCKING" ]; then
            echo ""
            echo "❌ BLOCKING: undefined names"
            echo "$BLOCKING"
            exit 1
          fi
          echo "✅ No undefined-name errors (other findings are advisory)"
      - name: Mypy (advisory until the baseline is clean, then make blocking)
        continue-on-error: true
        run: |
          python -m mypy --ignore-missing-imports --no-error-summary \
            threshold_engine.py archive_reader.py brain.py brain_enhanced.py

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # bot_config.load_config() hard-exits without these; CI dummies are fine
      TELEGRAM_BOT_TOKEN: "123456:CI_DUMMY_TOKEN_FOR_TESTS"
      TELEGRAM_CHAT_ID: "12345"
      REDIS_URL: "redis://localhost:6379/0"
      DELTA_API_BASE: "https://api.example.com"
      # Bot modules live in src/. Tests import them by bare name, so src/
      # must be on sys.path. The root conftest.py also inserts it, but
      # being explicit here means the tests still work if conftest is
      # ever refactored away.
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest numpy pydantic orjson redis aiohttp
      - run: python -m pytest tests/ -q