name: 🛑 CI Bot

# push is limited to main: with a bare `push` every PR commit ran the whole suite twice
# (once for the push, once for the pull_request) because the two events use different
# concurrency groups.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: "pip"

      - name: Install linters
        run: pip install pyflakes==3.2.0 mypy==1.11.0

      - name: Syntax gate (py_compile everything)
        run: python -m compileall -q .

      - name: Encoding gate (UTF-8 / BOM / CRLF / invisible chars / mojibake / missing encoding=)
        run: python scripts/encoding_gate.py

      - name: Pyflakes (BLOCKING on real errors only)
        run: |
          set +e
          OUTPUT=$(pyflakes . 2>&1)
          PYFLAKES_EXIT=$?
          set -e

          if [ "$PYFLAKES_EXIT" -eq 0 ]; then
            echo "pyflakes clean"
            exit 0
          fi

          echo "pyflakes findings"
          echo "$OUTPUT"

          BLOCKING=$(echo "$OUTPUT" | grep -E "undefined name" || true)
          if [ -n "$BLOCKING" ]; then
            echo "BLOCKING: undefined names"
            echo "$BLOCKING"
            exit 1
          fi

          echo "No undefined-name errors (other findings are advisory)"

      - name: Mypy (BLOCKING)
        run: |
          python -m mypy --ignore-missing-imports --no-error-summary \
            src/macd_unified.py src/aot_bridge.py src/numeric_selftest.py \
            src/alert_registry.py src/bot_config.py src/state.py src/fetcher.py src/indicators.py \
            src/gates.py src/alerts.py src/alert_advisor.py \
            src/config_base.py src/threshold_engine.py src/brain_layers.py src/plan_replay.py \
            src/threshold_stats.py src/threshold_analysis.py src/threshold_validation.py \
            src/threshold_models.py src/threshold_quality.py src/threshold_repair.py \
            src/brain.py src/brain_enhanced.py src/brain_engine.py src/brain_helpers.py \
            src/brain_report.py src/brain_recommend_baseline.py src/brain_recommend_full.py \
            src/brain_audit.py src/outcome_storage.py src/learner.py \
            src/hypothesis_gen.py src/archive_reader.py src/repair_ledger.py src/playbook.py \
            src/rulemine.py src/feature_store.py src/scoreboard.py src/feedback.py src/pathrecon.py src/autopsy.py \
            src/intelligence.py src/autotune.py src/config_advisor.py \
            src/elliott_wave.py src/elliott_alerts.py src/elliott_tracker.py \
            src/redis_audit.py src/cleanup_outcomes.py

  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: "123456:CI_DUMMY_TOKEN_FOR_TESTS"
      TELEGRAM_CHAT_ID: "12345"
      REDIS_URL: "redis://localhost:6379/0"
      DELTA_API_BASE: "https://api.example.com"
      PYTHONPATH: "src"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Dependency sanity check
        run: pip check

      - name: Run unit tests
        run: python -m pytest tests/ -q

      - name: Numeric self-test (must pass before a build is trusted)
        run: |
          python - <<'PY'
          import sys
          import numeric_selftest

          ok, failures = numeric_selftest.run_self_test()
          for msg in failures:
              print("FAIL:", msg)

          sys.exit(0 if ok else 1)
          PY

  aot-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: "123456:CI_DUMMY_TOKEN_FOR_TESTS"
      TELEGRAM_CHAT_ID: "12345"
      REDIS_URL: "redis://localhost:6379/0"
      DELTA_API_BASE: "https://api.example.com"
      PYTHONPATH: "src:."
      NUMERIC_SELFTEST_JIT_CROSSCHECK: "true"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build the Cython extension (same command as the Dockerfile)
        run: python setup.py build_ext --inplace

      - name: Numeric self-test on the AOT backend, cross-checked against Numba
        run: |
          python - <<'PY'
          import sys
          import aot_bridge
          import numeric_selftest

          aot_bridge.ensure_initialized()
          if not aot_bridge.is_using_aot():
              print("FAIL: AOT backend not active:", aot_bridge.get_fallback_reason())
              sys.exit(1)

          ok, failures = numeric_selftest.run_self_test()
          for msg in failures:
              print("FAIL:", msg)

          sys.exit(0 if ok else 1)
          PY

  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SHELLCHECK_OPTS: "--severity=warning"

    steps:
      - uses: actions/checkout@v7

      - name: Run actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color