name: 🛑 CI Bot

on: [push, pull_request, workflow_dispatch]

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install linters
        run: pip install pyflakes==3.2.0 mypy==1.11.0

      - name: Syntax gate (py_compile everything)
        run: python -m compileall -q .

      - name: Encoding gate (UTF-8 / BOM / CRLF / invisible chars / mojibake / missing encoding=)
        run: python scripts/encoding_gate.py

      - name: Pyflakes (BLOCKING on real errors only)
        run: |
          set +e
          OUTPUT=$(pyflakes . 2>&1)
          PYFLAKES_EXIT=$?
          set -e

          if [ "$PYFLAKES_EXIT" -eq 0 ]; then
            echo "pyflakes clean"
            exit 0
          fi

          echo "pyflakes findings"
          echo "$OUTPUT"

          BLOCKING=$(echo "$OUTPUT" | grep -E "undefined name" || true)
          if [ -n "$BLOCKING" ]; then
            echo "BLOCKING: undefined names"
            echo "$BLOCKING"
            exit 1
          fi

          echo "No undefined-name errors (other findings are advisory)"

      - name: Mypy (advisory until the baseline is clean, then make blocking)
        continue-on-error: true
        run: |
          python -m mypy --ignore-missing-imports --no-error-summary \
            src/threshold_engine.py src/threshold_stats.py src/threshold_analysis.py \
            src/threshold_validation.py src/threshold_models.py src/threshold_quality.py \
            src/threshold_repair.py src/archive_reader.py src/plan_replay.py \
            src/brain.py src/brain_enhanced.py src/brain_engine.py src/repair_ledger.py || true

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: "123456:CI_DUMMY_TOKEN_FOR_TESTS"
      TELEGRAM_CHAT_ID: "12345"
      REDIS_URL: "redis://localhost:6379/0"
      DELTA_API_BASE: "https://api.example.com"
      PYTHONPATH: "src"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Dependency sanity check
        run: pip check

      - name: Run unit tests
        run: python -m pytest tests/ -q

      - name: Numeric self-test (must pass before a build is trusted)
        run: |
          python - <<'PY'
          import sys
          import numeric_selftest

          ok, failures = numeric_selftest.run_self_test()
          for msg in failures:
              print("FAIL:", msg)

          sys.exit(0 if ok else 1)
          PY

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SHELLCHECK_OPTS: "--severity=warning"

    steps:
      - uses: actions/checkout@v7

      - name: Run actionlint
        run: |
          bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color