name: 🛑 CI Bot

on: [push, pull_request, workflow_dispatch]

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install linters
        run: pip install pyflakes==3.2.0 mypy==1.11.0
      - name: Syntax gate (py_compile everything)
        run: python -m compileall -q .
      - name: Encoding gate (UTF-8 / U+FFFD / mojibake / missing encoding=)
        run: |
          python - <<'PY'
          from __future__ import annotations
          from pathlib import Path
          import ast
          import re
          import sys

          TEXT_EXTENSIONS = {
              ".py", ".md", ".yml", ".yaml", ".json", ".txt",
              ".rst", ".cfg", ".ini", ".toml", ".sh", ".bash",
          }
          TEXT_FILENAMES = {
              "Dockerfile", "Makefile", "requirements.txt",
              ".gitignore", ".gitattributes", ".editorconfig",
          }
          SKIP_DIR_PARTS = {
              ".git", "__pycache__", ".venv", "venv", "env",
              "node_modules", ".mypy_cache", ".pytest_cache",
              ".ruff_cache", ".tox", ".eggs", "build", "dist",
          }

          # Each pattern is the accidental rendering of a real UTF-8
          # sequence when a UTF-8 file is decoded as Latin-1 or CP1252.
          # These sequences are VALID UTF-8, so a straight UTF-8 decode
          # accepts them silently - only a regex catches them. Written with
          # \u escapes and ASCII-only comments so THIS file contains none
          # of the glyphs it is hunting for.
          #
          #   \u00c3 = A-tilde   Latin-1 misread of a UTF-8 lead byte 0xC3
          #   \u00c2 = A-circ    Latin-1 misread of a UTF-8 lead byte 0xC2
          #   \u00e2\u20ac = a-circ + euro  CP1252 misread of 0xE2 0x80
          #   \u00e2\u0080 = a-circ + C1     Latin-1 misread of 0xE2 0x80
          #   \u00f0\u0178 = eth + Y-diaer   CP1252 misread of an emoji
          #   \u00f0\u009f = eth + C1        Latin-1 misread of an emoji
          #   \u00ef\u00bb\u00bf = BOM rendered as text
          MOJIBAKE_PATTERNS = [
              "\u00c3[\u0080-\u00bf]",
              "\u00c2[\u0080-\u00bf]",
              "\u00e2\u20ac[\u0080-\u00bf]",
              "\u00e2\u0080[\u0080-\u00bf]",
              "\u00f0\u0178[\u0080-\u00bf]",
              "\u00f0\u009f[\u0080-\u00bf]",
              "\u00ef\u00bb\u00bf",
          ]
          MOJIBAKE_RE = re.compile("|".join(MOJIBAKE_PATTERNS))

          # Repo-relative paths (posix, e.g. "tests/fixtures/x.py") whose
          # mojibake patterns are intentional - typically encoding-detector
          # test fixtures. Keep this list empty unless you actually need it.
          MOJIBAKE_ALLOWLIST: set[str] = set()

          def iter_text_files(root: Path):
              for p in root.rglob("*"):
                  if not p.is_file():
                      continue
                  if any(part in SKIP_DIR_PARTS for part in p.parts):
                      continue
                  if p.suffix.lower() in TEXT_EXTENSIONS or p.name in TEXT_FILENAMES:
                      yield p

          def check_bytes_and_mojibake(root: Path) -> list[str]:
              problems: list[str] = []
              for p in iter_text_files(root):
                  try:
                      text = p.read_text(encoding="utf-8")
                  except UnicodeDecodeError as e:
                      problems.append(f"{p}: invalid UTF-8: {e}")
                      continue

                  if "\ufffd" in text:
                      for i, line in enumerate(text.splitlines(), 1):
                          if "\ufffd" in line:
                              problems.append(
                                  f"{p}:{i}: U+FFFD replacement char: "
                                  f"{line.strip()[:120]}"
                              )

                  if p.as_posix() in MOJIBAKE_ALLOWLIST:
                      continue
                  for i, line in enumerate(text.splitlines(), 1):
                      m = MOJIBAKE_RE.search(line)
                      if m:
                          problems.append(
                              f"{p}:{i}: mojibake {m.group()!r}: "
                              f"{line.strip()[:120]}"
                          )
              return problems

          def _missing_kw(node: ast.Call, name: str) -> bool:
              return not any(k.arg == name for k in node.keywords)

          def _open_missing_encoding(node: ast.Call) -> bool:
              if not _missing_kw(node, "encoding"):
                  return False
              mode = None
              if len(node.args) >= 2 and isinstance(node.args[1], ast.Constant):
                  mode = node.args[1].value
              for kw in node.keywords:
                  if kw.arg == "mode" and isinstance(kw.value, ast.Constant):
                      mode = kw.value.value
              if isinstance(mode, str) and "b" in mode:
                  return False
              return True

          def check_python_encodings(root: Path) -> list[str]:
              problems: list[str] = []
              for p in sorted(root.rglob("*.py")):
                  if any(part in SKIP_DIR_PARTS for part in p.parts):
                      continue
                  try:
                      tree = ast.parse(p.read_text(encoding="utf-8"), filename=str(p))
                  except (SyntaxError, UnicodeDecodeError):
                      continue
                  for node in ast.walk(tree):
                      if not isinstance(node, ast.Call):
                          continue
                      fn = node.func
                      if isinstance(fn, ast.Name) and fn.id == "open":
                          if _open_missing_encoding(node):
                              problems.append(
                                  f"{p}:{node.lineno}: open() missing encoding= - "
                                  f"add encoding='utf-8'"
                              )
                      if isinstance(fn, ast.Attribute) and fn.attr in (
                          "read_text", "write_text",
                      ):
                          if _missing_kw(node, "encoding"):
                              problems.append(
                                  f"{p}:{node.lineno}: .{fn.attr}() missing encoding= - "
                                  f"add encoding='utf-8'"
                              )
                      if isinstance(fn, ast.Attribute) and fn.attr in (
                          "run", "Popen", "check_output", "check_call", "call",
                      ):
                          kw_names = {k.arg for k in node.keywords if k.arg}
                          if ("text" in kw_names or "universal_newlines" in kw_names) \
                                  and "encoding" not in kw_names:
                              problems.append(
                                  f"{p}:{node.lineno}: subprocess.{fn.attr}"
                                  f"(text=True) missing encoding= - add "
                                  f"encoding='utf-8'"
                              )
              return problems

          def main() -> int:
              root = Path(".")
              problems = check_bytes_and_mojibake(root)
              problems += check_python_encodings(root)
              if problems:
                  print("BLOCKING: encoding / mojibake / UTF-8 issues")
                  for prob in problems:
                      print("  -", prob)
                  return 1
              print(
                  "All text files valid UTF-8, no U+FFFD, no mojibake, "
                  "and every Python text I/O call declares UTF-8."
              )
              return 0

          sys.exit(main())
          PY
      - name: Pyflakes (BLOCKING on real errors only)
        run: |
          set +e
          OUTPUT=$(pyflakes . 2>&1)
          PYFLAKES_EXIT=$?
          set -e
          if [ "$PYFLAKES_EXIT" -eq 0 ]; then
            echo "pyflakes clean"
            exit 0
          fi
          echo "pyflakes findings"
          echo "$OUTPUT"
          BLOCKING=$(echo "$OUTPUT" | grep -E "undefined name" || true)
          if [ -n "$BLOCKING" ]; then
            echo "BLOCKING: undefined names"
            echo "$BLOCKING"
            exit 1
          fi
          echo "No undefined-name errors (other findings are advisory)"
      - name: Mypy (advisory until the baseline is clean, then make blocking)
        continue-on-error: true
        run: |
          python -m mypy --ignore-missing-imports --no-error-summary \
            src/threshold_engine.py src/threshold_stats.py src/threshold_analysis.py \
            src/threshold_validation.py src/threshold_models.py src/threshold_quality.py \
            src/threshold_repair.py src/archive_reader.py src/plan_replay.py \
            src/brain.py src/brain_enhanced.py src/brain_engine.py src/repair_ledger.py || true

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: "123456:CI_DUMMY_TOKEN_FOR_TESTS"
      TELEGRAM_CHAT_ID: "12345"
      REDIS_URL: "redis://localhost:6379/0"
      DELTA_API_BASE: "https://api.example.com"
      PYTHONPATH: src
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - run: pip check
      - run: python -m pytest tests/ -q
      - name: Numeric self-test (must pass before a build is trusted)
        run: |
          python - <<'PY'
          import sys
          import numeric_selftest
          ok, failures = numeric_selftest.run_self_test()
          for msg in failures:
              print("FAIL:", msg)
          sys.exit(0 if ok else 1)
          PY

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SHELLCHECK_OPTS: "--severity=warning"
    steps:
      - uses: actions/checkout@v7
      - name: Run actionlint
        run: |
          bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color