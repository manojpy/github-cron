name: 🧠 Learner (validated trade-plan playbook)
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Compute and print only (write nothing, send nothing)'
        required: false
        default: false
        type: boolean
      rollback:
        description: 'Restore the previous playbook version and exit'
        required: false
        default: false
        type: boolean
      no_recon:
        description: 'Skip rebuilding missing candle paths of older real alerts'
        required: false
        default: false
        type: boolean
      no_control:
        description: 'Skip the candle-based control (nothing passes beyond PROMISING while PLAYBOOK_REQUIRE_CONTROL is on)'
        required: false
        default: false
        type: boolean

# One learner at a time; never overlaps itself.
concurrency:
  group: learner
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/macd-unified-aot

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: 🔥 Checkout config only
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            config_macd.json
          sparse-checkout-cone-mode: false

      - name: 📦 Clone data repository (read only use)
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          git clone --depth 1 \
            "https://oauth2:${DATA_REPO_TOKEN}@github.com/manojpy/outcome-data.git" \
            /tmp/data-repo
          # The image checks at import time that the archive folder is writable
          # (same as run-bot.yml). The learner never writes archives, and this
          # clone is thrown away with the runner, so open the permissions.
          mkdir -p /tmp/data-repo/outcomes /tmp/data-repo/shadow /tmp/data-repo/reports
          chmod -R 777 /tmp/data-repo

      - name: 🐳 Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔥 Pull Image (commit-matched, else latest)
        run: |
          BASE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          IMAGE="$BASE:sha-${GITHUB_SHA}"
          echo "🐳 Pulling image..."
          START=$(date +%s)
          if ! docker pull --quiet --platform linux/amd64 "$IMAGE"; then
            echo "::warning::Image for commit ${GITHUB_SHA} not built yet — running :latest (config may be newer than code)"
            IMAGE="$BASE:latest"
            docker pull --quiet --platform linux/amd64 "$IMAGE"
          fi
          echo "RUN_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "✅ Image ready in $(( $(date +%s) - START ))s"

      - name: 🧠 Run learner
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          ROLLBACK: ${{ inputs.rollback }}
          NO_CONTROL: ${{ inputs.no_control }}
          NO_RECON: ${{ inputs.no_recon }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          DELTA_API_BASE: ${{ secrets.DELTA_API_BASE }}
        run: |
          ENV_FILE="$(pwd)/.bot_env"
          {
            printf 'TELEGRAM_BOT_TOKEN=%s\n' "$TELEGRAM_BOT_TOKEN"
            printf 'TELEGRAM_CHAT_ID=%s\n' "$TELEGRAM_CHAT_ID"
            printf 'REDIS_URL=%s\n' "$REDIS_URL"
            printf 'DELTA_API_BASE=%s\n' "$DELTA_API_BASE"
            printf 'OUTCOME_DATA_DIR=%s\n' "/data"
          } > "$ENV_FILE"

          ARGS=""
          [ "$DRY_RUN" = "true" ] && ARGS="$ARGS --dry-run"
          [ "$ROLLBACK" = "true" ] && ARGS="$ARGS --rollback"
          [ "$NO_CONTROL" = "true" ] && ARGS="$ARGS --no-control"
          [ "$NO_RECON" = "true" ] && ARGS="$ARGS --no-recon"
          set +e
          docker run --rm \
            --platform linux/amd64 \
            --env-file "$ENV_FILE" \
            -e PYTHONPATH=/app/src \
            -v "$(pwd)/config_macd.json:/app/src/config_macd.json:ro" \
            -v /tmp/data-repo:/data:rw \
            "${{ env.RUN_IMAGE }}" \
            python learner.py $ARGS 2>&1 | tee learner.txt
          RC=${PIPESTATUS[0]}
          set -e
          rm -f "$ENV_FILE"
          {
            echo "## 🧠 Learner"
            echo '```'
            tail -n 60 learner.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $RC
