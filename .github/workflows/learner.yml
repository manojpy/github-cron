name: 🧠 Learner (validated trade-plan playbook)

# The SLOW half of the advisor. Every few hours it reads the outcome archive,
# builds a no-alert control from raw candles, runs the champion/challenger
# validation and writes a small versioned playbook to Redis. The 15-minute bot
# only READS that playbook (PLAYBOOK_MODE: off | shadow | live).
#
# It never places orders, never edits config_macd.json and never pushes to the
# data repo. Manual runs: tick dry_run to preview, or rollback to restore the
# previous playbook version.
on:
  schedule:
    - cron: "20 */6 * * *"      # 4x a day, off the 1/16/31/46 alert minutes
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Compute and print only (write nothing, send nothing)'
        required: false
        default: false
        type: boolean
      rollback:
        description: 'Restore the previous playbook version and exit'
        required: false
        default: false
        type: boolean
      no_recon:
        description: 'Skip rebuilding missing candle paths of older real alerts'
        required: false
        default: false
        type: boolean
      no_control:
        description: 'Skip the candle-based control (nothing passes beyond PROMISING while PLAYBOOK_REQUIRE_CONTROL is on)'
        required: false
        default: false
        type: boolean

# One learner at a time; never overlaps itself.
concurrency:
  group: learner
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/macd-unified-aot

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: 🔥 Checkout config only
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            config_macd.json
          sparse-checkout-cone-mode: false

      - name: 📦 Clone data repository (read only use)
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          git clone --depth 1 \
            "https://oauth2:${DATA_REPO_TOKEN}@github.com/manojpy/outcome-data.git" \
            /tmp/data-repo
          # The image checks at import time that the archive folder is writable
          # (same as run-bot.yml). The learner never writes archives, and this
          # clone is thrown away with the runner, so open the permissions.
          mkdir -p /tmp/data-repo/outcomes /tmp/data-repo/shadow /tmp/data-repo/reports
          chmod -R 777 /tmp/data-repo

      - name: 🐳 Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔥 Pull latest image
        run: docker pull --quiet --platform linux/amd64 "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

      - name: 🧠 Run learner
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          ROLLBACK: ${{ inputs.rollback }}
          NO_CONTROL: ${{ inputs.no_control }}
          NO_RECON: ${{ inputs.no_recon }}
        run: |
          ENV_FILE="$(pwd)/.bot_env"
          cat > "$ENV_FILE" <<EOF
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          REDIS_URL=${{ secrets.REDIS_URL }}
          DELTA_API_BASE=${{ secrets.DELTA_API_BASE }}
          OUTCOME_DATA_DIR=/data
          EOF
          ARGS=""
          [ "$DRY_RUN" = "true" ] && ARGS="$ARGS --dry-run"
          [ "$ROLLBACK" = "true" ] && ARGS="$ARGS --rollback"
          [ "$NO_CONTROL" = "true" ] && ARGS="$ARGS --no-control"
          [ "$NO_RECON" = "true" ] && ARGS="$ARGS --no-recon"
          set +e
          docker run --rm \
            --platform linux/amd64 \
            --env-file "$ENV_FILE" \
            -e PYTHONPATH=/app/src \
            -v "$(pwd)/config_macd.json:/app/src/config_macd.json:ro" \
            -v /tmp/data-repo:/data:rw \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" \
            python learner.py $ARGS 2>&1 | tee learner.txt
          RC=${PIPESTATUS[0]}
          set -e
          rm -f "$ENV_FILE"
          {
            echo "## 🧠 Learner"
            echo '```'
            tail -n 60 learner.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $RC
