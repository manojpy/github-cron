name: 🧠 Learner (validated trade-plan playbook)
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Compute and print only (write nothing, send nothing)'
        required: false
        default: false
        type: boolean
      rollback:
        description: 'Restore the previous playbook version and exit'
        required: false
        default: false
        type: boolean
      no_recon:
        description: 'Skip rebuilding missing candle paths of older real alerts'
        required: false
        default: false
        type: boolean
      no_control:
        description: 'Skip the candle-based control (nothing passes beyond PROMISING while PLAYBOOK_REQUIRE_CONTROL is on)'
        required: false
        default: false
        type: boolean
      brain_report:
        description: '🧠 Also send the Brain report now, whatever the age of the last one'
        required: false
        default: false
        type: boolean

# One learner at a time; never overlaps itself.
concurrency:
  group: learner
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/macd-unified-aot

jobs:
  learn:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: 🔥 Checkout config only
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            config_macd.json
          sparse-checkout-cone-mode: false

      - name: 📦 Clone data repository (read only use)
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          set -euo pipefail

          ASKPASS="$RUNNER_TEMP/git-askpass.sh"
          trap 'rm -f "$ASKPASS"' EXIT

          cat > "$ASKPASS" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$DATA_REPO_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$ASKPASS"

          export GIT_ASKPASS="$ASKPASS"
          export GIT_TERMINAL_PROMPT=0

          git clone --depth 1 \
            "https://github.com/manojpy/outcome-data.git" \
            /tmp/data-repo

          # Ensure the expected archive directories exist.
          mkdir -p \
            /tmp/data-repo/outcomes \
            /tmp/data-repo/shadow \
            /tmp/data-repo/reports

          # Container runs as appuser (uid 1000). Hand only the data dirs
          # to that uid so the runner can still finish the step cleanly.
          # (chmod without sudo after chown was the previous failure mode.)
          sudo chown -R 1000:1000 \
            /tmp/data-repo/outcomes \
            /tmp/data-repo/shadow \
            /tmp/data-repo/reports
          sudo chmod -R u+rwX,go+rX \
            /tmp/data-repo/outcomes \
            /tmp/data-repo/shadow \
            /tmp/data-repo/reports

      - name: 🐳 Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔥 Pull Image (commit-matched only)
        env:
          GH_TOKEN: ${{ github.token }}
          # true = fail when the fallback :latest lacks this commit's image-relevant code.
          STRICT_IMAGE_PROVENANCE: "true"
        run: |
          set -euo pipefail

          BASE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          IMAGE="$BASE:sha-${GITHUB_SHA}"

          echo "🐳 Pulling commit-matched image: $IMAGE"
          START=$(date +%s)

          # No sha image means no src/ change since the last build (build.yml is
          # path-filtered), so :latest runs the same code. Warn and fall back.
          if ! docker pull --quiet --platform linux/amd64 "$IMAGE"; then
            echo "::warning::No image for ${GITHUB_SHA} — falling back to :latest"
            echo "⚠️ Ran on :latest because sha-${GITHUB_SHA} was not available" >> "$GITHUB_STEP_SUMMARY"
            IMAGE="$BASE:latest"
            docker pull --quiet --platform linux/amd64 "$IMAGE"

            # Verify the "no sha image => same code" assumption instead of trusting it:
            # compare the image's build revision with this commit, counting only files
            # the image is built from. (A build still in progress also lands here.)
            REV=$(docker image inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE" 2>/dev/null || true)
            STALE=unknown
            if [ -z "$REV" ] || [ "$REV" = "<no value>" ]; then
              echo "::warning::Fallback image has no revision label - cannot tell whether it contains this commit's code"
            elif [ "$REV" = "$GITHUB_SHA" ]; then
              STALE=no
            else
              N=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${REV}...${GITHUB_SHA}" \
                    --jq '[.files[].filename | select(test("^(src/|requirements\\.txt$|Dockerfile$|setup\\.py$|\\.dockerignore$|\\.github/workflows/build\\.yml$)"))] | length' 2>/dev/null || echo "?")
              case "$N" in
                0)   STALE=no ;;
                ''|'?'|*[!0-9]*) echo "::warning::Could not compare image revision ${REV:0:12} with ${GITHUB_SHA:0:12}" ;;
                *)   STALE=yes
                     echo "::warning::Fallback :latest (built from ${REV:0:12}) is MISSING ${N} image-relevant file change(s) from ${GITHUB_SHA:0:12}"
                     echo "🚧 :latest is behind this commit by ${N} image-relevant file(s) (image rev ${REV:0:12})" >> "$GITHUB_STEP_SUMMARY" ;;
              esac
            fi
            echo "Image provenance: stale=${STALE}"
            if [ "$STALE" = "yes" ] && [ "${STRICT_IMAGE_PROVENANCE}" = "true" ]; then
              echo "::error::STRICT_IMAGE_PROVENANCE=true and the fallback image lacks this commit's code"
              exit 1
            fi
          fi

          echo "RUN_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          DIGEST=$(docker image inspect -f '{{join .RepoDigests ", "}}' "$IMAGE" 2>/dev/null || true)
          echo "🔖 Image identity: ${IMAGE} | digest: ${DIGEST:-n/a} | commit: ${GITHUB_SHA}"
          echo "✅ Image ready in $(( $(date +%s) - START ))s"

      - name: 🧠 Run learner
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          ROLLBACK: ${{ inputs.rollback }}
          NO_CONTROL: ${{ inputs.no_control }}
          NO_RECON: ${{ inputs.no_recon }}
          BRAIN_REPORT: ${{ inputs.brain_report }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          DELTA_API_BASE: ${{ secrets.DELTA_API_BASE }}
        run: |
          ENV_FILE="$(pwd)/.bot_env"
          {
            printf 'TELEGRAM_BOT_TOKEN=%s\n' "$TELEGRAM_BOT_TOKEN"
            printf 'TELEGRAM_CHAT_ID=%s\n' "$TELEGRAM_CHAT_ID"
            printf 'REDIS_URL=%s\n' "$REDIS_URL"
            printf 'DELTA_API_BASE=%s\n' "$DELTA_API_BASE"
            printf 'OUTCOME_DATA_DIR=%s\n' "/data"
          } > "$ENV_FILE"

          ARGS=""
          [ "$DRY_RUN" = "true" ] && ARGS="$ARGS --dry-run"
          [ "$ROLLBACK" = "true" ] && ARGS="$ARGS --rollback"
          [ "$NO_CONTROL" = "true" ] && ARGS="$ARGS --no-control"
          [ "$NO_RECON" = "true" ] && ARGS="$ARGS --no-recon"
          [ "$BRAIN_REPORT" = "true" ] && ARGS="$ARGS --brain-report"
          set +e
          docker run --rm \
            --platform linux/amd64 \
            --security-opt=no-new-privileges \
            --read-only \
            --cap-drop=ALL \
            --pids-limit=256 \
            --memory=2g \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --tmpfs /home/appuser/.cache:rw,noexec,nosuid,size=32m \
            --env-file "$ENV_FILE" \
            -e PYTHONPATH=/app/src \
            -v "$(pwd)/config_macd.json:/app/src/config_macd.json:ro" \
            -v /tmp/data-repo:/data:rw \
            "${{ env.RUN_IMAGE }}" \
            python learner.py $ARGS 2>&1 | tee learner.txt
          RC=${PIPESTATUS[0]}
          set -e
          rm -f "$ENV_FILE"
          {
            echo "## 🧠 Learner"
            echo '```'
            tail -n 60 learner.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $RC

      - name: 📤 Persist Brain report to data repo
        if: always() && inputs.dry_run != true
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -d /tmp/data-repo/.git ]; then
            echo "No data repo clone - nothing to persist"
            exit 0
          fi
          # The container created the report as uid 1000; take the clone back so
          # git can add, rebase and push as the runner user.
          sudo chown -R "$(id -u):$(id -g)" /tmp/data-repo
          cd /tmp/data-repo

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- reports
          if git diff --cached --quiet; then
            echo "No new Brain report to persist."
            exit 0
          fi
          git commit -m "chore: brain report $(date -u +%Y-%m-%d_%H-%M)"
          # Only the report is kept; anything else the learner touched in the
          # throwaway clone must not block the rebase below.
          git reset --hard -q
          git clean -fdq

          ASKPASS="$RUNNER_TEMP/git-askpass.sh"
          trap 'rm -f "$ASKPASS"' EXIT
          cat > "$ASKPASS" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$DATA_REPO_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$ASKPASS"
          export GIT_ASKPASS="$ASKPASS"
          export GIT_TERMINAL_PROMPT=0

          # The alert workflow pushes every 15 minutes: rebase onto the latest main and retry.
          for attempt in 1 2 3 4 5; do
            if git push origin main; then
              echo "✅ Brain report pushed (attempt ${attempt})"
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              break
            fi
            echo "::warning::Push rejected (attempt ${attempt}/5) — rebasing onto latest main"
            sleep $(( attempt * 2 + RANDOM % 3 ))
            if ! git pull --rebase --no-tags origin main; then
              echo "::error::Rebase conflict — Brain report NOT pushed"
              git rebase --abort 2>/dev/null || true
              exit 1
            fi
          done
          echo "::error::Could not push the Brain report after 5 attempts"
          exit 1

      - name: 📨 Notify Telegram on Learner failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG="🔴 Learner workflow FAILED"$'\n'"Run: ${RUN_URL}"
          RESP=$(curl -sS --max-time 20 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" || true)
          if echo "$RESP" | grep -q '"ok":true'; then
            echo "Telegram notify delivered"
          else
            echo "::warning::Failure notice NOT delivered: ${RESP:0:200}"
          fi