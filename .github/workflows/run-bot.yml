name: 🤖 Run MACD Unified Bot (Hybrid)
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run mode (log alerts only)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      brain_report:
        description: '🧠 Send Brain Report'
        required: false
        default: false
        type: boolean
      apply_brain_plan:
        description: '✅ Apply last Brain action plan (--apply-brain) and exit'
        required: false
        default: false
        type: boolean
      clear_redis:
        description: '🧹 Clear outcomes + Brain-derived state (keeps config, weights, kill switch)'
        required: false
        default: false
        type: boolean
      clear_kill_switch:
        description: '🔓 Clear Kill Switch (manual override after review)'
        required: false
        default: false
        type: boolean

# Prevent overlapping runs from cron + manual dispatch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/macd-unified-aot
  BOT_TIMEOUT: 660
  # BRAIN_REPORT_ON_DEMAND is set per-run inside the bot_run step
  # via .bot_env (BRAIN_FULL), not here — the workflow's 12-hour
  # archive-depth decision is the real cadence control.
  CLEAR_REDIS: ${{ inputs.clear_redis }}
  CLEAR_KILL_SWITCH: ${{ inputs.clear_kill_switch }}

jobs:
  run-bot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read

    steps:
      # PHASE 0: START THE IMAGE PULL FIRST
      # The pull is the slowest step. It runs in the background while checkout,
      # config checks and the archive checkout proceed, and a later step waits for it.
      - name: 🔥 Start image pull (background)
        run: |
          BASE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          IMAGE="${BASE}:sha-${GITHUB_SHA}"
          echo "RUN_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "PULL_STARTED=$(date +%s)" >> "$GITHUB_ENV"
          rm -f /tmp/image-pull.rc /tmp/image-pull.log /tmp/image-pull.used

          # The sha-<commit> tag only exists for commits that triggered build.yml
          # (src/, requirements, Dockerfile...). After a config/README/workflow-only
          # commit it is missing, so the :latest fallback must start HERE, inside the
          # background job.
          cat > /tmp/pull-image.sh <<'EOF'
          #!/bin/sh
          SHA_IMAGE="$1"; LATEST_IMAGE="$2"
          # Prefer the exact SHA tag. Fall back to :latest only if the SHA tag does not exist.
          if docker pull --quiet --platform linux/amd64 "$SHA_IMAGE" > /tmp/image-pull.log 2>&1; then
            printf '%s\n' "$SHA_IMAGE" > /tmp/image-pull.used
            printf '0\n' > /tmp/image-pull.rc.tmp && mv /tmp/image-pull.rc.tmp /tmp/image-pull.rc
          elif docker pull --quiet --platform linux/amd64 "$LATEST_IMAGE" >> /tmp/image-pull.log 2>&1; then
            printf '%s\n' "$LATEST_IMAGE" > /tmp/image-pull.used
            printf '0\n' > /tmp/image-pull.rc.tmp && mv /tmp/image-pull.rc.tmp /tmp/image-pull.rc
          else
            printf '1\n' > /tmp/image-pull.rc.tmp && mv /tmp/image-pull.rc.tmp /tmp/image-pull.rc
          fi
          EOF
          chmod +x /tmp/pull-image.sh
          nohup /tmp/pull-image.sh "$IMAGE" "${BASE}:latest" > /dev/null 2>&1 &
          echo "🐳 Pulling $IMAGE in the background (falls back to :latest if that tag does not exist)"

      # PHASE 1: VALIDATION & SETUP
      - name: 📄 Fetch config_macd.json (raw first, API fallback)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUT=config_macd.json
          rm -f "$OUT" "$OUT.tmp"

          fetch() {
            curl -4 --fail --silent --show-error --location \
                 --connect-timeout 5 --max-time 15 \
                 --retry 2 --retry-delay 1 \
                 --header "Authorization: Bearer ${GH_TOKEN}" \
                 "$@" --output "$OUT.tmp" || return 1
            python3 - "$OUT.tmp" <<'PY' || return 1
          import json, sys
          raw = open(sys.argv[1]).read()
          c = json.loads(raw)                                  # rejects HTML / truncated bodies
          assert len(raw) > 100, "suspiciously small"          # your check, kept
          assert isinstance(c, dict) and isinstance(c.get("PAIRS"), list) and c["PAIRS"], "no PAIRS list"
          PY
            mv -f "$OUT.tmp" "$OUT"
          }
          # 1) raw — different edge than api.github.com, SHA-pinned (immutable).
          #    Token is harmless on a public repo and keeps working if it goes private.
          if fetch "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/config_macd.json"; then
            SRC=raw
          # 2) Contents API — the old behaviour, now only the fallback.
          elif fetch "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/config_macd.json?ref=${GITHUB_SHA}" \
                 --header "Accept: application/vnd.github.raw" \
                 --header "X-GitHub-Api-Version: 2022-11-28"; then
            SRC=api
          else
            echo "::error::config_macd.json unreachable via raw AND API at ${GITHUB_SHA:0:8}"
            exit 1
          fi
          test -s "$OUT"
          echo "📄 config_macd.json fetched via ${SRC} ($(wc -c < "$OUT") bytes) at ${GITHUB_SHA:0:8}"

      - name: 🔑 Verify secrets + config, decide Brain depth
        id: brain_depth
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          DELTA_API_BASE: ${{ secrets.DELTA_API_BASE }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          BRAIN_REPORT_INPUT: ${{ inputs.brain_report }}
          APPLY_BRAIN_PLAN: ${{ inputs.apply_brain_plan }}
        run: |
          set -euo pipefail
          # 1) Required secrets — all five, exactly as before.
          MISSING=""
          for v in TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID REDIS_URL DELTA_API_BASE DATA_REPO_TOKEN; do
            if [ -z "${!v:-}" ]; then MISSING="$MISSING $v"; fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required secret(s):$MISSING"
            exit 1
          fi
          echo "✅ All required secrets configured"
          # 2) Config: ONE python call validates the JSON and extracts both values
          #    the workflow needs (on-demand report switch + staleness limit).
          #    BRAIN_REPORT_ON_DEMAND is otherwise invisible to this workflow, so a
          #    report forced inside the bot would run against a shallow archive.
          if [ ! -f config_macd.json ]; then
            echo "::error::config_macd.json not found in the workspace"
            exit 1
          fi
          if ! CFG=$(python3 -c "import json; c=json.load(open('config_macd.json')); od='true' if str(c.get('BRAIN_REPORT_ON_DEMAND', False)).strip().lower() in ('true','1') else 'false'; print(od, int(c.get('MAX_CANDLE_STALENESS_SEC', 1200)))" 2>&1); then
            echo "::error::config_macd.json is not valid JSON"
            echo "$CFG"
            exit 1
          fi
          ON_DEMAND="${CFG%% *}"
          MAX_STALE="${CFG##* }"
          echo "✅ Config loaded from repository: config_macd.json"
          echo "late_limit=$(( MAX_STALE - 900 ))" >> "$GITHUB_OUTPUT"
          # 3) Archive depth. An apply-brain dispatch skips both the archive
          #    checkout and the bot run, so these outputs are not consumed there.
          if [ "$APPLY_BRAIN_PLAN" = "true" ]; then
            echo "brain_full=false" >> "$GITHUB_OUTPUT"
            echo "archive_days=3"   >> "$GITHUB_OUTPUT"
            echo "🧠 Apply-brain dispatch: archive depth decision skipped"
            exit 0
          fi
          NOW=$(date -u +%s)
          # 900 s = one 15-minute slot; 48 slots = 12 hours (00:00/12:00 UTC).
          SCHEDULED=false
          if [ $(( (NOW / 900) % 48 )) -eq 0 ]; then SCHEDULED=true; fi

          # Catch-up: a dispatch that never ran (or a run that was cancelled) at
          # 00:00/12:00 used to cost the whole 12 h report. Read the newest archived
          # report name (reports/YYYY-MM-DD_HH-MM.md, UTC). If the last one is older
          # than 12.5 h, run the full archive on the next whole-hour slot. Hourly, not
          # every 15 min, so a report that keeps failing cannot turn every run into a
          # heavy one; and not once the last report is over 36 h old (a persistent
          # fault needs a person, not an hourly retry). Any lookup failure means
          # "no catch-up", which is exactly the behaviour without this block.
          CATCHUP=false
          if [ "$SCHEDULED" != "true" ] && [ $(( (NOW / 900) % 4 )) -eq 0 ]; then
            LAST_TS=$(curl -fsS --max-time 10 \
                -H "Authorization: Bearer $DATA_REPO_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/manojpy/outcome-data/contents/reports?ref=main" 2>/dev/null \
              | python3 -c "
          import sys, json, re
          from datetime import datetime, timezone
          try:
              names = [e['name'] for e in json.load(sys.stdin) if isinstance(e, dict)]
          except Exception:
              sys.exit(0)
          best = 0
          for n in names:
              m = re.fullmatch(r'(\d{4}-\d{2}-\d{2})_(\d{2})-(\d{2})\.md', n)
              if m:
                  t = datetime.strptime(m.group(1) + ' ' + m.group(2) + ':' + m.group(3), '%Y-%m-%d %H:%M')
                  best = max(best, int(t.replace(tzinfo=timezone.utc).timestamp()))
          print(best or '')
          " 2>/dev/null || true)
            if [ -n "$LAST_TS" ]; then
              AGE=$(( NOW - LAST_TS ))
              if [ "$AGE" -ge 45000 ] && [ "$AGE" -le 129600 ]; then
                CATCHUP=true
                echo "🧠 Last Brain report is $(( AGE / 3600 )) h old — catch-up run"
              fi
            else
              echo "ℹ️ Could not read the last report time — no catch-up check this run"
            fi
          fi

          if [ "$BRAIN_REPORT_INPUT" = "true" ] || [ "$ON_DEMAND" = "true" ] || [ "$SCHEDULED" = "true" ] || [ "$CATCHUP" = "true" ]; then
            echo "brain_full=true"  >> "$GITHUB_OUTPUT"
            echo "archive_days=185" >> "$GITHUB_OUTPUT"
            echo "🧠 Brain-report run: full 185-day archive"
          else
            echo "brain_full=false" >> "$GITHUB_OUTPUT"
            echo "archive_days=3"   >> "$GITHUB_OUTPUT"
            echo "⚡ Alert-only run: 3-day archive"
          fi

      - name: 📦 Checkout outcome-data archive
        if: inputs.apply_brain_plan != true
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          ARCHIVE_DAYS: ${{ steps.brain_depth.outputs.archive_days }}
        run: |
          START=$(date +%s)

          # Token via GIT_ASKPASS, never in the remote URL: a URL credential is
          # written to .git/config, and this folder is mounted into the bot
          # container. The partial clone also fetches blobs lazily at checkout,
          # so GIT_ASKPASS must stay exported for the whole step.
          ASKPASS="$RUNNER_TEMP/git-askpass.sh"
          trap 'rm -f "$ASKPASS"' EXIT

          cat > "$ASKPASS" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$DATA_REPO_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$ASKPASS"

          export GIT_ASKPASS="$ASKPASS"
          export GIT_TERMINAL_PROMPT=0

          # --filter=blob:none makes this a partial clone: only trees/commits are
          # downloaded up front, and file contents are fetched lazily for exactly
          # the paths that sparse-checkout materialises. Without it, --depth=1
          # still downloads EVERY file at the tip, whatever the sparse list says.
          git clone --depth=1 --no-checkout --filter=blob:none \
            "https://github.com/manojpy/outcome-data.git" \
            /tmp/data-repo
          echo '*.jsonl merge=union' >> /tmp/data-repo/.git/info/attributes

          cd /tmp/data-repo

          # Fail loudly if the branch was renamed/removed — do not proceed
          # into a silent empty checkout.
          if ! git rev-parse --verify --quiet origin/main >/dev/null; then
            echo "::error::Branch 'main' not found in outcome-data repo"
            exit 1
          fi
          git sparse-checkout init --no-cone
          python3 - "$ARCHIVE_DAYS" > .git/info/sparse-checkout <<'PY'
          import datetime, sys

          days = int(sys.argv[1])
          today = datetime.datetime.now(datetime.timezone.utc).date()
          print("outcomes/.gitkeep")
          print("shadow/.gitkeep")
          print("reports/.gitkeep")
          print("candidates/.gitkeep")
          for i in range(days):
              d = (today - datetime.timedelta(days=i)).isoformat()
              print(f"outcomes/{d}.jsonl")
              print(f"outcomes/{d}.jsonl.gz")
              print(f"shadow/{d}.jsonl")
              print(f"shadow/{d}.jsonl.gz")
              print(f"candidates/{d}.jsonl")
              print(f"candidates/{d}.jsonl.gz")
          PY
          git checkout main
          cd -

          mkdir -p /tmp/data-repo/outcomes /tmp/data-repo/shadow /tmp/data-repo/reports /tmp/data-repo/candidates
          # a+rwX: the container user (uid 1000) can write, but files do not gain the
          # exec bit, so git sees no mode changes. .git is not touched.
          chmod a+rwx /tmp/data-repo
          chmod -R a+rwX /tmp/data-repo/outcomes /tmp/data-repo/shadow /tmp/data-repo/reports /tmp/data-repo/candidates

          # ── AUDIT: prove what actually landed on disk ──
          echo "=== /tmp/data-repo top level ==="
          ls -la /tmp/data-repo
          echo "=== jsonl files (line counts) ==="
          find /tmp/data-repo -maxdepth 2 -name '*.jsonl' -exec wc -l {} + || echo "(none)"
          echo "=== today / yesterday ==="
          TODAY=$(date -u +%F)
          YESTERDAY=$(date -u -d "yesterday" +%F)
          for f in "/tmp/data-repo/outcomes/${TODAY}.jsonl" \
                   "/tmp/data-repo/outcomes/${YESTERDAY}.jsonl" \
                   "/tmp/data-repo/shadow/${TODAY}.jsonl" \
                   "/tmp/data-repo/shadow/${YESTERDAY}.jsonl"; do
            if [ -f "$f" ]; then
              echo "  ✓ $f ($(wc -l < "$f") lines)"
            else
              echo "  ✗ $f (missing)"
            fi
          done

          echo "data_checkout_seconds=$(( $(date +%s) - START ))"

      - name: ⏳ Wait for image
        env:
          GH_TOKEN: ${{ github.token }}
          # true = refuse to run on a :latest image that is older than this commit in
          # anything the image contains. Default false: a late alert beats no alert.
          STRICT_IMAGE_PROVENANCE: "false"
        run: |
          WAIT_START=$(date +%s)
          # 0.2 s polling, max ~240 s (1200 * 0.2 s): the SHA pull can fail first and
          # the :latest fallback then starts, so the budget covers two pulls.
          i=1
          while [ "$i" -le 1200 ]; do
            [ -f /tmp/image-pull.rc ] && break
            sleep 0.2
            i=$((i + 1))
          done
          if [ "$(cat /tmp/image-pull.rc 2>/dev/null || echo 1)" != "0" ]; then
            echo "::error::Neither sha-${GITHUB_SHA} nor :latest is available in the registry"
            cat /tmp/image-pull.log 2>/dev/null || true
            exit 1
          fi
          IMAGE=$(cat /tmp/image-pull.used)
          if [ "$IMAGE" != "${{ env.RUN_IMAGE }}" ]; then
            echo "::warning::Image for commit ${GITHUB_SHA} not available — running on :latest"
            echo "⚠️ Ran on :latest because sha-${GITHUB_SHA} was not available" >> "$GITHUB_STEP_SUMMARY"
            echo "RUN_IMAGE=$IMAGE" >> "$GITHUB_ENV"

            # Provenance: is the :latest we fell back to missing code from this commit?
            # Only files the image is built from matter (src/, requirements, Dockerfile,
            # setup.py, .dockerignore, build.yml); docs/workflow-only commits are harmless.
            REV=$(docker image inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE" 2>/dev/null || true)
            STALE=unknown
            if [ -z "$REV" ] || [ "$REV" = "<no value>" ]; then
              echo "::warning::Fallback image has no revision label - cannot tell whether it contains this commit's code"
            elif [ "$REV" = "$GITHUB_SHA" ]; then
              STALE=no
            else
              N=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${REV}...${GITHUB_SHA}" \
                    --jq '[.files[].filename | select(test("^(src/|requirements\\.txt$|Dockerfile$|setup\\.py$|\\.dockerignore$|\\.github/workflows/build\\.yml$)"))] | length' 2>/dev/null || echo "?")
              case "$N" in
                0)   STALE=no ;;
                ''|'?'|*[!0-9]*) echo "::warning::Could not compare image revision ${REV:0:12} with ${GITHUB_SHA:0:12}" ;;
                *)   STALE=yes
                     echo "::warning::Fallback :latest (built from ${REV:0:12}) is MISSING ${N} image-relevant file change(s) from ${GITHUB_SHA:0:12}"
                     echo "🚧 :latest is behind this commit by ${N} image-relevant file(s) (image rev ${REV:0:12})" >> "$GITHUB_STEP_SUMMARY" ;;
              esac
            fi
            echo "Image provenance: stale=${STALE}"
            if [ "$STALE" = "yes" ] && [ "${STRICT_IMAGE_PROVENANCE}" = "true" ]; then
              echo "::error::STRICT_IMAGE_PROVENANCE=true and the fallback image lacks this commit's code - not running"
              exit 1
            fi
          fi
          if ! docker image inspect "$IMAGE" >/dev/null 2>&1; then
            echo "::error::Image $IMAGE is not present locally after pull"
            exit 1
          fi
          SIZE_MB=$(( $(docker image inspect -f '{{.Size}}' "$IMAGE") / 1048576 ))
          echo "✅ Image ready: pull ran $(( $(date +%s) - PULL_STARTED ))s in total, this step waited $(( $(date +%s) - WAIT_START ))s, ${SIZE_MB} MB on disk"
          DIGEST=$(docker image inspect -f '{{join .RepoDigests ", "}}' "$IMAGE" 2>/dev/null || true)
          echo "🔖 Image identity: ${IMAGE} | digest: ${DIGEST:-n/a} | commit: ${GITHUB_SHA}"

      - name: ✅ Apply Brain Plan (on-demand)
        if: inputs.apply_brain_plan == true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          DELTA_API_BASE: ${{ secrets.DELTA_API_BASE }}
        run: |
          set -o pipefail
          mkdir -p logs
          ENV_FILE="$(pwd)/.bot_env"
          trap 'rm -f "$ENV_FILE"' EXIT
          {
            printf 'TELEGRAM_BOT_TOKEN=%s\n' "$TELEGRAM_BOT_TOKEN"
            printf 'TELEGRAM_CHAT_ID=%s\n' "$TELEGRAM_CHAT_ID"
            printf 'REDIS_URL=%s\n' "$REDIS_URL"
            printf 'DELTA_API_BASE=%s\n' "$DELTA_API_BASE"
          } > "$ENV_FILE"

          # The archive checkout is skipped for apply runs; create the folder the
          # image probes for writability at import time.
          mkdir -p /tmp/data-repo/outcomes /tmp/data-repo/shadow /tmp/data-repo/reports /tmp/data-repo/candidates
          # a+rwX: the container user (uid 1000) can write, but files do not gain the
          # exec bit, so git sees no mode changes. .git is not touched.
          chmod a+rwx /tmp/data-repo
          chmod -R a+rwX /tmp/data-repo/outcomes /tmp/data-repo/shadow /tmp/data-repo/reports /tmp/data-repo/candidates
          set +e
          timeout --signal=SIGTERM --kill-after=15s ${{ env.BOT_TIMEOUT }}s docker run \
            --rm \
            --pull=never \
            --name "macd_bot_apply_${{ github.run_id }}" \
            --platform linux/amd64 \
            --memory="900m" \
            --memory-swap="1800m" \
            --cpus="2.0" \
            --security-opt=no-new-privileges \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --tmpfs /home/appuser/.cache:rw,noexec,nosuid,size=32m \
            --env-file "$ENV_FILE" \
            -e TZ=Asia/Kolkata \
            -e PYTHONPATH=/app/src \
            -e PYTHONUNBUFFERED=1 \
            -e OUTCOME_DATA_DIR=/tmp/data-repo \
            -v "/tmp/data-repo:/tmp/data-repo:rw" \
            -v "$(pwd)/config_macd.json:/app/src/config_macd.json:ro" \
            "${{ env.RUN_IMAGE }}" \
            python macd_unified.py --apply-brain 2>&1 | tee logs/bot_output.log

          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ Apply-brain failed with exit code $EXIT_CODE" >> $GITHUB_STEP_SUMMARY
            exit $EXIT_CODE
          fi
          echo "✅ Apply-brain step finished — see logs above for applied changes." >> $GITHUB_STEP_SUMMARY

      - name: ⏱️ Align start to the candle close
        if: inputs.apply_brain_plan != true
        env:
          TARGET_START_AGE: "55"   # seconds after the 15m close; must stay above CANDLE_MIN_AGE_BUFFER (45)
          # EARLY_DISPATCH_WINDOW: 0 = off (default, behaviour unchanged).
          # Set it to 150 ONLY if the Cloudflare cron is moved one minute earlier
          # (14,29,44,59 * * * *). A run that wakes up within this many seconds BEFORE a
          # close then waits for that close + TARGET_START_AGE instead of treating the
          # previous candle as "already past the target" and starting on a stale candle.
          EARLY_DISPATCH_WINDOW: "0"
        run: |
          NOW=$(date +%s)
          AGE=$(( NOW - (NOW / 900) * 900 ))
          TO_NEXT=$(( 900 - AGE ))
          if [ "$EARLY_DISPATCH_WINDOW" -gt 0 ] && [ "$TO_NEXT" -le "$EARLY_DISPATCH_WINDOW" ]; then
            WAIT=$(( TO_NEXT + TARGET_START_AGE ))
            echo "⏳ ${TO_NEXT}s BEFORE the next 15m close — waiting ${WAIT}s so the bot starts at ${TARGET_START_AGE}s after it"
            sleep "$WAIT"
          elif [ "$AGE" -lt "$TARGET_START_AGE" ]; then
            WAIT=$(( TARGET_START_AGE - AGE ))
            echo "⏳ ${AGE}s after the 15m close — waiting ${WAIT}s so the bot starts at ${TARGET_START_AGE}s"
            sleep "$WAIT"
          else
            echo "▶️ ${AGE}s after the 15m close — already past the ${TARGET_START_AGE}s target, starting now"
          fi

      - name: 🚀 Execute MACD Bot
        if: inputs.apply_brain_plan != true
        id: bot_run
        timeout-minutes: 12

        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          DELTA_API_BASE: ${{ secrets.DELTA_API_BASE }}
        run: |
          set -o pipefail
          mkdir -p logs
          echo "::group::🔥 Launch Macd-Unified...🔥"
          echo "🕐 Trigger Time: $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M:%S IST')"
          echo "🏷️ Image: ${{ env.RUN_IMAGE }}"
          echo "🧪 Dry Run: $DRY_RUN"
          echo "🧹 Clear Redis: $CLEAR_REDIS"
          BRAIN_FULL="${{ steps.brain_depth.outputs.brain_full }}"
          if [ "$BRAIN_FULL" = "true" ]; then BRAIN_SHALLOW=false; else BRAIN_SHALLOW=true; fi
          echo "🧠 Brain Report: $BRAIN_FULL (shallow archive: $BRAIN_SHALLOW)"
          echo "🔓 Clear Kill Switch: $CLEAR_KILL_SWITCH"
          echo "::endgroup::"

          START_TIME=$(date +%s)
          echo "🕐 TRIGGER_TIMESTAMP=$START_TIME ($(TZ=Asia/Kolkata date -d @$START_TIME '+%Y-%m-%d %H:%M:%S IST'))"
          # The bot rejects every pair once TRIGGER_TIMESTAMP is more than
          # (MAX_CANDLE_STALENESS_SEC - 900)s after the 15m close. Computed once in
          # the verify/depth step from the same config parse. 300 = 1200 - 900 default.
          LATE_LIMIT="${{ steps.brain_depth.outputs.late_limit || '300' }}"
          AGE_AT_START=$(( START_TIME - (START_TIME / 900) * 900 ))
          echo "⏱️ Bot starts ${AGE_AT_START}s after the 15m close (limit ${LATE_LIMIT}s)"
          if [ "$AGE_AT_START" -gt "$LATE_LIMIT" ]; then
            echo "::warning::Started ${AGE_AT_START}s after the 15m close (limit ${LATE_LIMIT}s) — this run will skip every pair as stale"
            echo "## ⚠️ Late start: ${AGE_AT_START}s after close (limit ${LATE_LIMIT}s) — all pairs skipped as stale" >> "$GITHUB_STEP_SUMMARY"
          fi

          ENV_FILE="$(pwd)/.bot_env"
          trap 'rm -f "$ENV_FILE"' EXIT
          {
            printf 'TELEGRAM_BOT_TOKEN=%s\n' "$TELEGRAM_BOT_TOKEN"
            printf 'TELEGRAM_CHAT_ID=%s\n' "$TELEGRAM_CHAT_ID"
            printf 'REDIS_URL=%s\n' "$REDIS_URL"
            printf 'DELTA_API_BASE=%s\n' "$DELTA_API_BASE"
            printf 'DRY_RUN_MODE=%s\n' "$DRY_RUN"
            printf 'TRIGGER_TIMESTAMP=%s\n' "$START_TIME"
            printf 'CLEAR_REDIS=%s\n' "$CLEAR_REDIS"
            printf 'BRAIN_REPORT_ON_DEMAND=%s\n' "$BRAIN_FULL"
            printf 'BRAIN_ARCHIVE_SHALLOW=%s\n' "$BRAIN_SHALLOW"
            printf 'CLEAR_KILL_SWITCH=%s\n' "$CLEAR_KILL_SWITCH"
          } > "$ENV_FILE"

          set +e
          timeout --signal=SIGTERM --kill-after=15s ${{ env.BOT_TIMEOUT }}s docker run \
            --rm \
            --pull=never \
            --name "macd_bot_${{ github.run_id }}" \
            --platform linux/amd64 \
            --memory="900m" \
            --memory-swap="1800m" \
            --cpus="2.0" \
            --security-opt=no-new-privileges \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --tmpfs /home/appuser/.cache:rw,noexec,nosuid,size=32m \
            --env-file "$ENV_FILE" \
            -e TZ=Asia/Kolkata \
            -e REQUIRE_AOT=true \
            -e PYTHONPATH=/app/src \
            -e PYTHONUNBUFFERED=1 \
            -e OUTCOME_DATA_DIR=/tmp/data-repo \
            -v "/tmp/data-repo:/tmp/data-repo:rw" \
            -v "$(pwd)/config_macd.json:/app/src/config_macd.json:ro" \
            "${{ env.RUN_IMAGE }}" 2>&1 | tee logs/bot_output.log

          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          DURATION=$(( $(date +%s) - START_TIME ))
          echo "execution_time=${DURATION}" >> $GITHUB_OUTPUT
          echo "exit_code=${EXIT_CODE}" >> $GITHUB_OUTPUT

          if [ $EXIT_CODE -eq 124 ] || [ $EXIT_CODE -eq 137 ]; then
            echo "⚠️ Bot execution timed out after ${DURATION}s" | tee -a logs/bot_output.log
            exit 1
          elif [ $EXIT_CODE -ne 0 ]; then
            echo "❌ Bot exited with code $EXIT_CODE" | tee -a logs/bot_output.log
            exit 1
          fi

          echo "✅ Bot completed successfully in ${DURATION}s"

      # `timeout` can SIGKILL the docker CLI after its grace period, which leaves
      # the container running and still holding the run lock / mounted data dir
      # while the persist step below reads it. Make sure it is gone.
      - name: 🧹 Remove leftover bot container
        if: always()
        run: |
          docker rm -f "macd_bot_${{ github.run_id }}" "macd_bot_apply_${{ github.run_id }}" >/dev/null 2>&1 || true

      # PHASE 3: RESULTS ANALYSIS
      - name: 📊 Parse Execution Results
        if: always()
        id: results
        run: |
          LOG_FILE="logs/bot_output.log"
          if [ ! -f "$LOG_FILE" ]; then
            echo "status=Failed" >> $GITHUB_OUTPUT
            echo "error_msg=No bot log — run failed before the bot started" >> $GITHUB_OUTPUT
            exit 0
          fi
          if grep -q "RUN COMPLETE" "$LOG_FILE"; then
            STATUS="Success"
            # Read the figures from the RUN COMPLETE line only: the startup banner
            # also prints "Pairs: 30 | ...", which used to be picked up as "pairs scanned".
            SUMMARY_LINE=$(grep "RUN COMPLETE" "$LOG_FILE" | tail -1)
            DURATION=$(grep -oP "Duration:\s*\K[\d.]+(?=s)" <<< "$SUMMARY_LINE" | head -1 || echo "N/A")
            ALERTS=$(grep -oP "Alerts:\s*\K\d+" <<< "$SUMMARY_LINE" | head -1 || echo "0")
            ELLIOTT=$(grep -oP "\(\+\K\d+(?= Elliott\))" <<< "$SUMMARY_LINE" | head -1 || echo "0")
            ALERTS=$(( ${ALERTS:-0} + ${ELLIOTT:-0} ))
            PAIRS=$(grep -oP "Pairs:\s*\K[\d/]+" <<< "$SUMMARY_LINE" | head -1 || echo "N/A")
            MEMORY=$(grep -oP "Memory:\s*\K\d+MB" <<< "$SUMMARY_LINE" | head -1 || echo "N/A")
            REDIS_STATUS=$(grep -oP "Redis:\s*\K\w+" <<< "$SUMMARY_LINE" | head -1 || echo "UNKNOWN")
          elif grep -q "Could not take the run lock" "$LOG_FILE"; then
            STATUS="Skipped"
            ERROR_MSG="Run lock held by another instance - run skipped"
          else
            STATUS="Failed"
            ERROR_MSG=$(grep -E "FATAL ERROR|Bot run failed|Error|ERROR" "$LOG_FILE" | head -1 | cut -c1-120 || echo "Unknown error")
          fi

          echo "status=${STATUS}" >> $GITHUB_OUTPUT
          echo "duration=${DURATION:-N/A}" >> $GITHUB_OUTPUT
          echo "alerts=${ALERTS:-0}" >> $GITHUB_OUTPUT
          echo "pairs=${PAIRS:-N/A}" >> $GITHUB_OUTPUT
          echo "memory=${MEMORY:-N/A}" >> $GITHUB_OUTPUT
          echo "redis_status=${REDIS_STATUS:-UNKNOWN}" >> $GITHUB_OUTPUT
          echo "error_msg=${ERROR_MSG:-None}" >> $GITHUB_OUTPUT

      - name: 📋 Generate Summary Report
        if: always()
        env:
          ERROR_MSG: ${{ steps.results.outputs.error_msg }}
        run: |
          echo "## 🤖 MACD Bot Execution Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.results.outputs.status }}" = "Failed" ]; then
            echo "### ❌ Error Details" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "$ERROR_MSG" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.results.outputs.status }}" = "Skipped" ]; then
            echo "### ⏭️ Run skipped (run lock held by another instance)" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ✅ Run Completed Successfully" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- ⏱️ Duration: ${{ steps.results.outputs.duration }}s" >> $GITHUB_STEP_SUMMARY
            echo "- 📊 Alerts Sent: ${{ steps.results.outputs.alerts }}" >> $GITHUB_STEP_SUMMARY
            echo "- 📈 Pairs Scanned: ${{ steps.results.outputs.pairs }}" >> $GITHUB_STEP_SUMMARY
            echo "- 💾 Memory Used: ${{ steps.results.outputs.memory }}" >> $GITHUB_STEP_SUMMARY
            echo "- 🗄️ Redis Status: ${{ steps.results.outputs.redis_status }}" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 🩺 Add run health to summary
        if: always() && inputs.apply_brain_plan != true
        run: |
          F=/tmp/data-repo/run_summary.json
          if [ ! -f "$F" ]; then
            echo "ℹ️ No run_summary.json was written this run" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - "$F" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          s = json.load(open(sys.argv[1]))
          tg = s.get("telegram") or {}
          dlq = s.get("telegram_dlq") or {}
          print("### 🩺 Run health")
          print(f"- Telegram: {tg.get('sent_ok', 0)} sent, {tg.get('sent_failed', 0)} failed, DLQ pending {dlq.get('pending')}")
          print(f"- Redis: {s.get('redis_status')} (memory {s.get('redis_mem_pct')}%)")
          print(f"- Pairs: {s.get('pairs_completed')}/{s.get('pairs_configured')} completed, {s.get('pairs_deferred')} deferred")
          stale = s.get("stale_candle_pairs") or []
          print(f"- Stale candles: {', '.join(stale) if stale else 'none'}")
          print(f"- Dedup: {s.get('dedup_text')}")
          PY

      # PHASE 4: ARTIFACT UPLOAD & VISIBILITY
      - name: 📂 Ensure Logs Directory Exists
        if: always()
        run: |
          mkdir -p logs
          if [ ! -f "logs/bot_output.log" ]; then
            echo "No logs from bot execution" > logs/bot_output.log
          fi

      - name: 📦 Upload Execution Logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: bot-execution-logs-${{ github.run_number }}
          path: logs/
          retention-days: 7
          compression-level: 9
          if-no-files-found: ignore

      - name: 📍 Add Log Location to Summary
        if: failure()
        run: |
          echo "## 📋 Execution Logs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 Logs available in: **Artifacts > bot-execution-logs-${{ github.run_number }}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "logs/bot_output.log" ] && [ -s "logs/bot_output.log" ]; then
            echo "### 📄 Recent Log Output (last 50 lines)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 50 logs/bot_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No logs captured" >> $GITHUB_STEP_SUMMARY
          fi

      # PHASE 5: FAILURE NOTIFICATION
      - name: 📨 Notify Telegram on Failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS: ${{ steps.results.outputs.status || 'Unknown' }}
          ERROR_MSG: ${{ steps.results.outputs.error_msg || 'See workflow logs' }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXIT_CODE="${{ steps.bot_run.outputs.exit_code || 'N/A' }}"
          DURATION="${{ steps.bot_run.outputs.execution_time || 'N/A' }}"

          MSG="🔴 MACD Bot workflow FAILED"$'\n'"Status: ${STATUS}"$'\n'"Exit code: ${EXIT_CODE} | Duration: ${DURATION}s"$'\n'"Error: ${ERROR_MSG}"$'\n'"Run: ${RUN_URL}"

          RESP=$(curl -sS --max-time 20 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" || true)
          if echo "$RESP" | grep -q '"ok":true'; then
            echo "Telegram notify delivered"
          else
            echo "::warning::Telegram failure notice NOT delivered: ${RESP:0:200}"
          fi

      - name: 📤 Persist outcomes to data repo
        id: persist
        if: always()
        timeout-minutes: 4
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          if [ ! -d "/tmp/data-repo/.git" ]; then
            echo "::warning::Data repo not present — outcomes NOT persisted this run"
            exit 0
          fi

          # Same GIT_ASKPASS pattern as the clone step. Needed for the push, the
          # rebase fetch, and any lazy blob fetch (partial clone) done by
          # `git diff --cached --stat` below.
          ASKPASS="$RUNNER_TEMP/git-askpass.sh"
          trap 'rm -f "$ASKPASS"' EXIT

          cat > "$ASKPASS" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$DATA_REPO_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$ASKPASS"

          export GIT_ASKPASS="$ASKPASS"
          export GIT_TERMINAL_PROMPT=0

          cd /tmp/data-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TODAY=$(date -u +%F)
          YESTERDAY=$(date -u -d "yesterday" +%F)

          # ── Stage today's/yesterday's files explicitly ──
          # `git add -f` forces staging even when the file is new and the
          # clone was made with --no-checkout. `--sparse` can silently
          # refuse a file that has no prior index entry.
          for f in "outcomes/${TODAY}.jsonl" "shadow/${TODAY}.jsonl" "candidates/${TODAY}.jsonl" \
                   "outcomes/${YESTERDAY}.jsonl" "shadow/${YESTERDAY}.jsonl" "candidates/${YESTERDAY}.jsonl"; do
            if [ -f "$f" ]; then
              git add -f "$f"
            fi
          done

          # Safety net: if anything else new appeared under these dirs, grab it.
          git add -f outcomes shadow 2>/dev/null || true

          # Brain reports (Markdown) written by the bot this run. Kept 7 days;
          # the daily cleanup workflow deletes older ones.
          # --sparse is REQUIRED: report file names are not in the sparse-checkout
          # list, and a plain `git add` silently refuses paths outside it.
          git add --sparse -f reports 2>/dev/null || true

          # Candidate ledger (skipped-signal rows). Not an outcome table: no reader of
          # outcomes/ or shadow/ opens it. --sparse for the same reason as reports above.
          git add --sparse -f candidates 2>/dev/null || true

          # ── AUDIT: always print what's staged, even on no-op ──
          echo "=== git status ==="
          git status --short
          echo "=== staged diff stat ==="
          git diff --cached --stat || true

          if git diff --cached --quiet; then
            echo "::warning::No outcome changes to persist (outcome files may be missing or empty)"
            # Show what we actually looked for, so a zero-row Brain report
            # is diagnosable from the run log alone.
            echo "=== container output dir contents ==="
            ls -la outcomes/ 2>/dev/null || echo "(no outcomes dir)"
            ls -la shadow/   2>/dev/null || echo "(no shadow dir)"
            exit 0
          fi

          git commit -m "chore: persist outcomes $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # The cleanup workflow also pushes to this repo. If it landed between
          # our clone and now, a plain push is rejected as non-fast-forward and
          # this run's outcomes would be lost. Rebase onto the new tip and retry.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "✅ Outcomes pushed (attempt ${attempt})"
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              break
            fi
            echo "::warning::Push rejected (attempt ${attempt}/5) — rebasing onto latest main"
            sleep $(( attempt * 2 + RANDOM % 3 ))
            if ! git pull --rebase --no-tags origin main; then
              echo "::error::Rebase conflict — aborting; outcomes NOT persisted"
              git rebase --abort 2>/dev/null || true
              exit 1
            fi
          done
          echo "::error::Could not push outcomes after 5 attempts"
          exit 1

      # If the push above exhausted its retries, the runner's clone is about
      # to be thrown away. Keep this run's resolved rows as an artifact so
      # they can be re-committed by hand instead of being lost.
      - name: 🛟 Preserve un-pushed outcomes
        if: always() && steps.persist.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: unpushed-outcomes-${{ github.run_id }}
          path: |
            /tmp/data-repo/outcomes/*.jsonl
            /tmp/data-repo/shadow/*.jsonl
            /tmp/data-repo/candidates/*.jsonl
            /tmp/data-repo/reports/*.md
          retention-days: 7
          if-no-files-found: ignore

      # The failure notice above runs BEFORE the persist step, so a persist
      # failure (push retries exhausted) would otherwise never reach Telegram.
      - name: 📨 Notify Telegram on persist failure
        if: always() && steps.persist.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG="🟠 MACD Bot: outcomes NOT persisted to the data repo"$'\n'"The un-pushed rows were saved as artifact unpushed-outcomes-${{ github.run_id }} (7 days)."$'\n'"Run: ${RUN_URL}"
          RESP=$(curl -sS --max-time 20 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" || true)
          if echo "$RESP" | grep -q '"ok":true'; then
            echo "Telegram notify delivered"
          else
            echo "::warning::Persist-failure notice NOT delivered: ${RESP:0:200}"
          fi