name: 🤖 Run MACD Unified Bot (Hybrid)
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run mode (log alerts only)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      brain_report:
        description: '🧠 Send Brain Report'
        required: false
        default: false
        type: boolean
      apply_brain_plan:
        description: '✅ Apply last Brain action plan (--apply-brain) and exit'
        required: false
        default: false
        type: boolean
      clear_redis:
        description: '🧹 Clear ALL Redis keys'
        required: false
        default: false
        type: boolean
      clear_kill_switch:
        description: '🔓 Clear Kill Switch (manual override after review)'
        required: false
        default: false
        type: boolean
      

# Prevent overlapping runs from cron + manual dispatch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/macd-unified-aot
  BOT_TIMEOUT: 660
  # BRAIN_REPORT_ON_DEMAND is set per-run inside the bot_run step
  # via .bot_env (BRAIN_FULL), not here — the workflow's 6-hour
  # archive-depth decision is the real cadence control.
  CLEAR_REDIS: ${{ inputs.clear_redis }}
  CLEAR_KILL_SWITCH: ${{ inputs.clear_kill_switch }}

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    permissions:
      contents: read
      packages: read

    steps:
      # PHASE 1: VALIDATION & SETUP
      - name: 🔥 Checkout repository (for config_macd.json)
        uses: actions/checkout@v7
        with:
          # Only pull the config file — no need to clone the whole repo
          sparse-checkout: |
            config_macd.json
          sparse-checkout-cone-mode: false

      - name: 🔑 Verify Secrets
        run: |
          MISSING=()
          [ -z "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && MISSING+=("TELEGRAM_BOT_TOKEN")
          [ -z "${{ secrets.TELEGRAM_CHAT_ID }}" ] && MISSING+=("TELEGRAM_CHAT_ID")
          [ -z "${{ secrets.REDIS_URL }}" ] && MISSING+=("REDIS_URL")
          [ -z "${{ secrets.DELTA_API_BASE }}" ] && MISSING+=("DELTA_API_BASE")

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "❌ Missing secrets: ${MISSING[*]}"
            exit 1
          fi

          echo "✅ All required secrets configured"

      - name: 🔨 Verify Config (repo-only)
        run: |
          if [ ! -f config_macd.json ]; then
            echo "❌ config_macd.json not found in repository root"
            exit 1
          fi
          if ! python3 -c "import json; json.load(open('config_macd.json'))" 2>/dev/null; then
            echo "❌ config_macd.json is not valid JSON"
            exit 1
          fi
          echo "✅ Config loaded from repository: config_macd.json"

      - name: 🐳 Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔥 Pull Latest Image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo "🐳 Pulling image..."
          START=$(date +%s)
          docker pull --quiet --platform linux/amd64 "$IMAGE"
          echo "✅ Image ready in $(( $(date +%s) - START ))s"

      - name: ✅ Apply Brain Plan (on-demand)
        if: inputs.apply_brain_plan == true
        run: |
          ENV_FILE="$(pwd)/.bot_env"
          cat > "$ENV_FILE" <<EOF
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          REDIS_URL=${{ secrets.REDIS_URL }}
          DELTA_API_BASE=${{ secrets.DELTA_API_BASE }}
          EOF

          docker run --rm \
            --platform linux/amd64 \
            --env-file "$ENV_FILE" \
            -e PYTHONPATH=/app/src \
            -v "$(pwd)/config_macd.json:/app/src/config_macd.json:ro" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" \
            python macd_unified.py --apply-brain

          rm -f "$ENV_FILE"
          echo "✅ Apply-brain step finished — see logs above for applied changes." >> $GITHUB_STEP_SUMMARY

      - name: ⏱️ Check Dispatch Latency
        if: inputs.apply_brain_plan != true
        run: |
          BUFFER=$(python3 -c "import json; print(json.load(open('config_macd.json')).get('CANDLE_MIN_AGE_BUFFER', 60))" 2>/dev/null || echo 60)
          STALENESS=$(python3 -c "import json; print(json.load(open('config_macd.json')).get('MAX_CANDLE_STALENESS_SEC', 1200))" 2>/dev/null || echo 1200)

          NOW=$(date +%s)
          LAST_CLOSE=$(( (NOW / 900) * 900 ))  # The :00, :15, :30, :45 boundary
          AGE=$(( NOW - LAST_CLOSE ))

          echo "🕐 Last 15m candle closed ${AGE}s ago (need ${BUFFER}s buffer, max staleness ${STALENESS}s)"

          if [ "$AGE" -lt "$BUFFER" ]; then
            echo "⚠️ WARNING: Only ${AGE}s since candle close (buffer=${BUFFER}s) — may be rejected as unstable" >> $GITHUB_STEP_SUMMARY
          elif [ "$AGE" -gt "$STALENESS" ]; then
            echo "⚠️ WARNING: Candle is ${AGE}s old (max=${STALENESS}s) — may be rejected as stale" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 🧠 Decide Brain archive depth
        if: inputs.apply_brain_plan != true
        id: brain_depth
        run: |
          NOW=$(date -u +%s)
          # BRAIN_REPORT_ON_DEMAND is a separate force-report switch read
          # inside the bot itself (macd_unified.py, run_once). This workflow
          # step has no visibility into it otherwise, so a report forced that
          # way runs against a shallow 3-day checkout instead of the full
          # archive it actually needs. Parse it here so both triggers agree.
          ON_DEMAND=$(python3 -c "import json; print(json.load(open('config_macd.json')).get('BRAIN_REPORT_ON_DEMAND', False))" 2>/dev/null || echo "False")
          # 900 s = one 15-minute slot; 24 slots = 6 hours (00:00/06:00/12:00/18:00 UTC).
          if [ "${{ inputs.brain_report }}" = "true" ] || [ "$ON_DEMAND" = "True" ] || [ $(( (NOW / 900) % 24 )) -eq 0 ]; then
            echo "brain_full=true"  >> "$GITHUB_OUTPUT"
            echo "archive_days=185" >> "$GITHUB_OUTPUT"
            echo "🧠 Brain-report run: full 185-day archive"
          else
            echo "brain_full=false" >> "$GITHUB_OUTPUT"
            echo "archive_days=3"   >> "$GITHUB_OUTPUT"
            echo "⚡ Alert-only run: 3-day archive"
          fi

      - name: 📦 Checkout outcome-data archive
        if: inputs.apply_brain_plan != true
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          ARCHIVE_DAYS: ${{ steps.brain_depth.outputs.archive_days }}
        run: |
          START=$(date +%s)

          # --filter=blob:none makes this a partial clone: only trees/commits are
          # downloaded up front, and file contents are fetched lazily for exactly
          # the paths that sparse-checkout materialises. Without it, --depth=1
          # still downloads EVERY file at the tip, whatever the sparse list says.
          git clone --depth=1 --no-checkout --filter=blob:none \
            "https://oauth2:${DATA_REPO_TOKEN}@github.com/manojpy/outcome-data.git" \
            /tmp/data-repo

          cd /tmp/data-repo

          # Fail loudly if the branch was renamed/removed — do not proceed
          # into a silent empty checkout.
          if ! git rev-parse --verify --quiet origin/main >/dev/null; then
            echo "::error::Branch 'main' not found in outcome-data repo"
            exit 1
          fi
          git sparse-checkout init --no-cone
          {
            echo "brain_state.json"
            # Track .gitkeep so wiped-but-tracked directories materialise
            echo "outcomes/.gitkeep"
            echo "shadow/.gitkeep"
            echo "reports/.gitkeep"
            for i in $(seq 0 $(( ARCHIVE_DAYS - 1 ))); do
              D=$(date -u -d "-${i} days" +%Y-%m-%d)
              echo "outcomes/${D}.jsonl"
              echo "outcomes/${D}.jsonl.gz"
              echo "shadow/${D}.jsonl"
              echo "shadow/${D}.jsonl.gz"
            done
          } > .git/info/sparse-checkout
          git checkout main
          cd -

          mkdir -p /tmp/data-repo/outcomes /tmp/data-repo/shadow /tmp/data-repo/reports
          chmod -R 777 /tmp/data-repo

          # ── AUDIT: prove what actually landed on disk ──
          echo "=== /tmp/data-repo top level ==="
          ls -la /tmp/data-repo
          echo "=== jsonl files (line counts) ==="
          find /tmp/data-repo -maxdepth 2 -name '*.jsonl' -exec wc -l {} + || echo "(none)"
          echo "=== today / yesterday ==="
          TODAY=$(date -u +%F)
          YESTERDAY=$(date -u -d "yesterday" +%F)
          for f in "/tmp/data-repo/outcomes/${TODAY}.jsonl" \
                   "/tmp/data-repo/outcomes/${YESTERDAY}.jsonl" \
                   "/tmp/data-repo/shadow/${TODAY}.jsonl" \
                   "/tmp/data-repo/shadow/${YESTERDAY}.jsonl"; do
            if [ -f "$f" ]; then
              echo "  ✓ $f ($(wc -l < "$f") lines)"
            else
              echo "  ✗ $f (missing)"
            fi
          done

          echo "data_checkout_seconds=$(( $(date +%s) - START ))"

      - name: 🚀 Execute MACD Bot
        if: inputs.apply_brain_plan != true
        id: bot_run
        timeout-minutes: 12
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          mkdir -p logs
          echo "::group::🔥 Launch Macd-Unified...🔥"
          echo "🕐 Trigger Time: $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M:%S IST')"
          echo "🏷️ Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo "🧪 Dry Run: $DRY_RUN"
          echo "🧹 Clear Redis: $CLEAR_REDIS"
          BRAIN_FULL="${{ steps.brain_depth.outputs.brain_full }}"
          if [ "$BRAIN_FULL" = "true" ]; then BRAIN_SHALLOW=false; else BRAIN_SHALLOW=true; fi
          echo "🧠 Brain Report: $BRAIN_FULL (shallow archive: $BRAIN_SHALLOW)"
          echo "🔓 Clear Kill Switch: $CLEAR_KILL_SWITCH"
          echo "::endgroup::"  

          START_TIME=$(date +%s)
          echo "🕐 TRIGGER_TIMESTAMP=$START_TIME ($(TZ=Asia/Kolkata date -d @$START_TIME '+%Y-%m-%d %H:%M:%S IST'))"


          ENV_FILE="$(pwd)/.bot_env"
          cat > "$ENV_FILE" <<EOF
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          REDIS_URL=${{ secrets.REDIS_URL }}
          DELTA_API_BASE=${{ secrets.DELTA_API_BASE }}
          DRY_RUN_MODE=$DRY_RUN
          TRIGGER_TIMESTAMP=$START_TIME
          CLEAR_REDIS=$CLEAR_REDIS
          BRAIN_REPORT_ON_DEMAND=$BRAIN_FULL
          BRAIN_ARCHIVE_SHALLOW=$BRAIN_SHALLOW
          CLEAR_KILL_SWITCH=$CLEAR_KILL_SWITCH
          EOF

          timeout --signal=SIGTERM --kill-after=15s ${{ env.BOT_TIMEOUT }}s docker run             --rm             --name "macd_bot_${{ github.run_id }}"             --platform linux/amd64             --memory="900m"             --memory-swap="1800m"             --cpus="2.0"             --security-opt=no-new-privileges             --read-only             --tmpfs /tmp:rw,noexec,nosuid,size=64m             --tmpfs /home/appuser/.cache:rw,noexec,nosuid,size=32m             --env-file "$ENV_FILE"             -e TZ=Asia/Kolkata             -e PYTHONPATH=/app/src             -e PYTHONUNBUFFERED=1             -e NUMBA_NUM_THREADS=2             -e OMP_NUM_THREADS=2             -e OUTCOME_DATA_DIR=/tmp/data-repo             -v "/tmp/data-repo:/tmp/data-repo:rw"             -v "$(pwd)/config_macd.json:/app/src/config_macd.json:ro"             ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest 2>&1 | tee logs/bot_output.log

          EXIT_CODE=${PIPESTATUS[0]}
          DURATION=$(( $(date +%s) - START_TIME ))
          echo "execution_time=${DURATION}" >> $GITHUB_OUTPUT
          echo "exit_code=${EXIT_CODE}" >> $GITHUB_OUTPUT

          rm -f "$ENV_FILE"

          if [ $EXIT_CODE -eq 124 ] || [ $EXIT_CODE -eq 137 ]; then
            echo "⚠️ Bot execution timed out after ${DURATION}s" | tee -a logs/bot_output.log
            exit 1
          elif [ $EXIT_CODE -ne 0 ]; then
            echo "❌ Bot exited with code $EXIT_CODE" | tee -a logs/bot_output.log
            exit 1
          fi
          echo "✅ Bot completed successfully in ${DURATION}s"

      # PHASE 3: RESULTS ANALYSIS
      - name: 📊 Parse Execution Results
        if: always()
        id: results
        run: |
          LOG_FILE="logs/bot_output.log"
          if [ ! -f "$LOG_FILE" ]; then
            echo "status=error" >> $GITHUB_OUTPUT
            echo "message=Log file not found" >> $GITHUB_OUTPUT
            exit 0
          fi

          if grep -q "RUN COMPLETE" "$LOG_FILE"; then
            STATUS="Success"
            DURATION=$(grep -oP "Duration:\s*\K[\d.]+(?=s)" "$LOG_FILE" | head -1 || echo "N/A")
            ALERTS=$(grep -oP "(?:Alerts|Sent):\s*\K\d+" "$LOG_FILE" | head -1 || echo "0")
            PAIRS=$(grep -oP "Pairs:\s*\K[\d/]+" "$LOG_FILE" | head -1 || echo "N/A")
            MEMORY=$(grep -oP "Memory:\s*\K\d+MB" "$LOG_FILE" | head -1 || echo "N/A")
            REDIS_STATUS=$(grep -oP "Redis:\s*\K\w+" "$LOG_FILE" | head -1 || echo "UNKNOWN")
          else
            STATUS="Failed"
            ERROR_MSG=$(grep -E "FATAL ERROR|Bot run failed|Error|ERROR" "$LOG_FILE" | head -1 | cut -c1-120 || echo "Unknown error")
          fi

          echo "status=${STATUS}" >> $GITHUB_OUTPUT
          echo "duration=${DURATION:-N/A}" >> $GITHUB_OUTPUT
          echo "alerts=${ALERTS:-0}" >> $GITHUB_OUTPUT
          echo "pairs=${PAIRS:-N/A}" >> $GITHUB_OUTPUT
          echo "memory=${MEMORY:-N/A}" >> $GITHUB_OUTPUT
          echo "redis_status=${REDIS_STATUS:-UNKNOWN}" >> $GITHUB_OUTPUT
          echo "error_msg=${ERROR_MSG:-None}" >> $GITHUB_OUTPUT

      - name: 📋 Generate Summary Report
        if: always()
        run: |
          echo "## 🤖 MACD Bot Execution Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.results.outputs.status }}" != "Success" ]; then
            echo "### ❌ Error Details" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "${{ steps.results.outputs.error_msg }}" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ✅ Run Completed Successfully" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- ⏱️ Duration: ${{ steps.results.outputs.duration }}s" >> $GITHUB_STEP_SUMMARY
            echo "- 📊 Alerts Sent: ${{ steps.results.outputs.alerts }}" >> $GITHUB_STEP_SUMMARY
            echo "- 📈 Pairs Scanned: ${{ steps.results.outputs.pairs }}" >> $GITHUB_STEP_SUMMARY
            echo "- 💾 Memory Used: ${{ steps.results.outputs.memory }}" >> $GITHUB_STEP_SUMMARY
            echo "- 🗄️ Redis Status: ${{ steps.results.outputs.redis_status }}" >> $GITHUB_STEP_SUMMARY
          fi

      # PHASE 4: ARTIFACT UPLOAD & VISIBILITY
      - name: 📂 Ensure Logs Directory Exists
        if: always()
        run: |
          mkdir -p logs
          if [ ! -f "logs/bot_output.log" ]; then
            echo "No logs from bot execution" > logs/bot_output.log
          fi

      - name: 📦 Upload Execution Logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bot-execution-logs-${{ github.run_number }}
          path: logs/
          retention-days: 7
          compression-level: 9
          if-no-files-found: ignore

      - name: 📍 Add Log Location to Summary
        if: failure()
        run: |
          echo "## 📋 Execution Logs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 Logs available in: **Artifacts > bot-execution-logs-${{ github.run_number }}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "logs/bot_output.log" ] && [ -s "logs/bot_output.log" ]; then
            echo "### 📄 Recent Log Output (last 50 lines)" >> $GITHUB_STEP_SUMMARY
            echo '\`\`\`' >> $GITHUB_STEP_SUMMARY
            tail -n 50 logs/bot_output.log >> $GITHUB_STEP_SUMMARY
            echo '\`\`\`' >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No logs captured" >> $GITHUB_STEP_SUMMARY
          fi

      # PHASE 5: FAILURE NOTIFICATION
      - name: 📨 Notify Telegram on Failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          STATUS="${{ steps.results.outputs.status || 'Unknown' }}"
          ERROR_MSG="${{ steps.results.outputs.error_msg || 'See workflow logs' }}"
          EXIT_CODE="${{ steps.bot_run.outputs.exit_code || 'N/A' }}"
          DURATION="${{ steps.bot_run.outputs.execution_time || 'N/A' }}"

          MSG="🔴 MACD Bot workflow FAILED"$'\n'"Status: ${STATUS}"$'\n'"Exit code: ${EXIT_CODE} | Duration: ${DURATION}s"$'\n'"Error: ${ERROR_MSG}"$'\n'"Run: ${RUN_URL}"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"             --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}"             --data-urlencode "text=${MSG}"             -o /dev/null -w "Telegram notify HTTP %{http_code}\n"

      - name: 📤 Persist outcomes to data repo
        if: always()
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          if [ ! -d "/tmp/data-repo/.git" ]; then
            echo "::warning::Data repo not present — outcomes NOT persisted this run"
            exit 0
          fi

          cd /tmp/data-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TODAY=$(date -u +%F)
          YESTERDAY=$(date -u -d "yesterday" +%F)

          # ── Stage today's/yesterday's files explicitly ──
          # `git add -f` forces staging even when the file is new and the
          # clone was made with --no-checkout. `--sparse` can silently
          # refuse a file that has no prior index entry.
          for f in "outcomes/${TODAY}.jsonl" "shadow/${TODAY}.jsonl" \
                   "outcomes/${YESTERDAY}.jsonl" "shadow/${YESTERDAY}.jsonl"; do
            if [ -f "$f" ]; then
              git add -f "$f"
            fi
          done

          # Safety net: if anything else new appeared under these dirs, grab it.
          git add -f outcomes shadow 2>/dev/null || true

          # Brain reports (Markdown) written by the bot this run. Kept 7 days;
          # the daily cleanup workflow deletes older ones.
          # --sparse is REQUIRED: report file names are not in the sparse-checkout
          # list, and a plain `git add` silently refuses paths outside it.
          git add --sparse -f reports 2>/dev/null || true

          if [ -f brain_state.json ]; then
            git add -f brain_state.json
          fi

          # ── AUDIT: always print what's staged, even on no-op ──
          echo "=== git status ==="
          git status --short
          echo "=== staged diff stat ==="
          git diff --cached --stat || true

          if git diff --cached --quiet; then
            echo "::warning::No outcome changes to persist (outcome files may be missing or empty)"
            # Show what we actually looked for, so a zero-row Brain report
            # is diagnosable from the run log alone.
            echo "=== container output dir contents ==="
            ls -la outcomes/ 2>/dev/null || echo "(no outcomes dir)"
            ls -la shadow/   2>/dev/null || echo "(no shadow dir)"
            exit 0
          
          fi

          git commit -m "chore: persist outcomes $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # The cleanup workflow also pushes to this repo. If it landed between
          # our clone and now, a plain push is rejected as non-fast-forward and
          # this run's outcomes would be lost. Rebase onto the new tip and retry.
          PUSH_URL="https://oauth2:${DATA_REPO_TOKEN}@github.com/manojpy/outcome-data.git"
          for attempt in 1 2 3 4 5; do
            if git push "$PUSH_URL" HEAD:main; then
              echo "✅ Outcomes pushed (attempt ${attempt})"
              exit 0
            fi
            echo "::warning::Push rejected (attempt ${attempt}/5) — rebasing onto latest main"
            sleep $(( attempt * 2 + RANDOM % 3 ))
            if ! git pull --rebase --no-tags "$PUSH_URL" main; then
              echo "::error::Rebase conflict — aborting; outcomes NOT persisted"
              git rebase --abort 2>/dev/null || true
              exit 1
            fi
          done
          echo "::error::Could not push outcomes after 5 attempts"
          exit 1