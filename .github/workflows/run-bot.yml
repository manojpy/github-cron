name: 🤖 Run MACD Unified Bot (Hybrid)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run mode (log alerts only)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      skip_alerts:
        description: 'Skip Telegram alerts (test mode)'
        required: false
        default: 'false'
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: manojpy/github-cron/macd-unified-aot
  BOT_TIMEOUT: 300
  WORKFLOW_TIMEOUT: 6

jobs:
  run-bot:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      packages: read

    steps:
      # PHASE 1: VALIDATION & SETUP
      - name: 🔐 Verify Secrets
        run: |
          MISSING=()
          [ -z "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && MISSING+=("TELEGRAM_BOT_TOKEN")
          [ -z "${{ secrets.TELEGRAM_CHAT_ID }}" ] && MISSING+=("TELEGRAM_CHAT_ID")
          [ -z "${{ secrets.REDIS_URL }}" ] && MISSING+=("REDIS_URL")
          [ -z "${{ secrets.DELTA_API_BASE }}" ] && MISSING+=("DELTA_API_BASE")
          
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "❌ Missing secrets: ${MISSING[*]}"
            exit 1
          fi

      # OPTIMIZATION: Config created from Secret instead of Git Checkout
      # Requires secret 'MACD_CONFIG_JSON' containing the JSON content
      - name: 📄 Create Config
        run: |
          if [ -n "${{ secrets.MACD_CONFIG_JSON }}" ]; then
            echo '${{ secrets.MACD_CONFIG_JSON }}' > config_macd.json
            echo "✅ Config loaded from Secret (Fast)"
          else
            # Fallback if secret is missing (slower, but safe)
            echo "⚠️ Secret MACD_CONFIG_JSON missing, cloning repo..."
            git clone --depth 1 --filter=blob:none --sparse https://github.com/${{ github.repository }} .
            git sparse-checkout set config_macd.json
          fi

      - name: 🐳 Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # OPTIMIZATION: ZSTD compressed images pull significantly faster
      - name: 📥 Pull Latest Image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo "🐳 Pulling image..."
          START=$(date +%s)
          docker pull --quiet --platform linux/amd64 "$IMAGE"
          echo "✅ Image ready in $(( $(date +%s) - START ))s"

      # PHASE 2: BOT EXECUTION
      - name: 🚀 Execute MACD Bot
        id: bot_run
        timeout-minutes: 7
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          mkdir -p logs
          echo "::group::🔥 Launch Macd-Unified...🔥"
          echo "🕐 Trigger Time: $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M:%S IST')"
          echo "🧪 Dry Run: $DRY_RUN"
          echo "::endgroup::"

          START_TIME=$(date +%s)
          timeout --signal=SIGTERM --kill-after=15s ${{ env.BOT_TIMEOUT }}s docker run \
            --rm \
            --name macd_bot_runner \
            --platform linux/amd64 \
            --network host \
            --memory="900m" \
            --memory-swap="1800m" \
            --cpus="2.0" \
            --security-opt=no-new-privileges \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --tmpfs /home/appuser/.cache:rw,noexec,nosuid,size=32m \
            -e TZ=Asia/Kolkata \
            -e PYTHONPATH=/app/src:$PYTHONPATH \
            -e TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}" \
            -e TELEGRAM_CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -e REDIS_URL="${{ secrets.REDIS_URL }}" \
            -e DELTA_API_BASE="${{ secrets.DELTA_API_BASE }}" \
            -e DRY_RUN_MODE="$DRY_RUN" \
            -e PYTHONUNBUFFERED=1 \
            -e NUMBA_NUM_THREADS=2 \
            -e OMP_NUM_THREADS=2 \
            -v "$(pwd)/config_macd.json:/app/src/config_macd.json:ro" \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest 2>&1 | tee logs/bot_output.log

          EXIT_CODE=${PIPESTATUS[0]}
          DURATION=$(( $(date +%s) - START_TIME ))
          echo "execution_time=${DURATION}" >> $GITHUB_OUTPUT
          echo "exit_code=${EXIT_CODE}" >> $GITHUB_OUTPUT

          if [ $EXIT_CODE -eq 124 ] || [ $EXIT_CODE -eq 137 ]; then
            echo "⚠️ Bot execution timed out after ${DURATION}s" | tee -a logs/bot_output.log
            exit 1
          elif [ $EXIT_CODE -ne 0 ]; then
            echo "❌ Bot exited with code $EXIT_CODE" | tee -a logs/bot_output.log
            exit 1
          fi
          echo "✅ Bot completed successfully in ${DURATION}s"

      # PHASE 3: RESULTS ANALYSIS
      - name: 📊 Parse Execution Results
        if: always()
        id: results
        run: |
          LOG_FILE="logs/bot_output.log"
          if [ ! -f "$LOG_FILE" ]; then
            echo "status=error" >> $GITHUB_OUTPUT
            echo "message=Log file not found" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          if grep -q "RUN COMPLETE" "$LOG_FILE"; then
            STATUS="Success"
            DURATION=$(grep -oP "Duration:\s*\K[\d.]+(?=s)" "$LOG_FILE" | head -1 || echo "N/A")
            ALERTS=$(grep -oP "(?:Alerts|Sent):\s*\K\d+" "$LOG_FILE" | head -1 || echo "0")
            PAIRS=$(grep -oP "Pairs:\s*\K[\d/]+" "$LOG_FILE" | head -1 || echo "N/A")
            MEMORY=$(grep -oP "Memory:\s*\K\d+MB" "$LOG_FILE" | head -1 || echo "N/A")
            REDIS_STATUS=$(grep -oP "Redis:\s*\K\w+" "$LOG_FILE" | head -1 || echo "UNKNOWN")
          else
            STATUS="Failed"
            ERROR_MSG=$(grep -E "FATAL ERROR|Bot run failed|Error|ERROR" "$LOG_FILE" | head -1 | cut -c1-120 || echo "Unknown error")
          fi
          
          echo "status=${STATUS}" >> $GITHUB_OUTPUT
          echo "duration=${DURATION:-N/A}" >> $GITHUB_OUTPUT
          echo "alerts=${ALERTS:-0}" >> $GITHUB_OUTPUT
          echo "pairs=${PAIRS:-N/A}" >> $GITHUB_OUTPUT
          echo "memory=${MEMORY:-N/A}" >> $GITHUB_OUTPUT
          echo "redis_status=${REDIS_STATUS:-UNKNOWN}" >> $GITHUB_OUTPUT
          echo "error_msg=${ERROR_MSG:-None}" >> $GITHUB_OUTPUT

      - name: 📋 Generate Summary Report
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 🤖 MACD Bot Execution Report
          
          | Metric | Value |
          |--------|-------|
          | **Status** | ${{ steps.results.outputs.status }} |
          | **Duration** | ${{ steps.results.outputs.duration }}s |
          | **Alerts** | ${{ steps.results.outputs.alerts }} |
          | **Pairs** | ${{ steps.results.outputs.pairs }} |
          | **Memory** | ${{ steps.results.outputs.memory }} |
          | **Redis** | ${{ steps.results.outputs.redis_status }} |
          
          EOF
          
          if [ "${{ steps.results.outputs.status }}" != "success" ]; then
            echo "### ❌ Error Details" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "${{ steps.results.outputs.error_msg }}" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

      # PHASE 4: ARTIFACT UPLOAD & VISIBILITY
      - name: 📂 Ensure Logs Directory Exists
        if: always()
        run: |
          mkdir -p logs
          if [ ! -f "logs/bot_output.log" ]; then
            echo "No logs from bot execution" > logs/bot_output.log
          fi

      - name: 📦 Upload Execution Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-execution-logs-${{ github.run_number }}
          path: logs/
          retention-days: 2
          compression-level: 9
          if-no-files-found: ignore