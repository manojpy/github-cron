name: 🔎 Redis Key & TTL Audit

on:
  workflow_run:
    workflows: ["🧠 Learner (validated trade-plan playbook)"]
    types: [completed]
    branches: [main]

  workflow_dispatch:
    inputs:
      fail_on_findings:
        description: 'Fail the job if the audit reports a warning/error finding'
        required: false
        default: false
        type: boolean
      heal_durable_ttl:
        description: 'ONE-OFF WRITE: raise old 7-day TTLs on standing-decision keys to 90 days'
        required: false
        default: false
        type: boolean
      heal_ttl_leaks:
        description: 'ONE-OFF WRITE: set a 30-day TTL on NO_TTL_LEAK keys (allow-listed families only)'
        required: false
        default: false
        type: boolean
      heal_dry_run:
        description: 'With heal_durable_ttl or heal_ttl_leaks: only show what would change, write nothing'
        required: false
        default: false
        type: boolean

concurrency:
  group: redis-audit
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install redis client
        run: pip install --quiet redis==5.2.1

      - name: Run audit
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          FAIL_ON_FINDINGS: ${{ github.event_name == 'workflow_run' || inputs.fail_on_findings }}
          HEAL_DURABLE_TTL: ${{ inputs.heal_durable_ttl }}
          HEAL_TTL_LEAKS: ${{ inputs.heal_ttl_leaks }}
          HEAL_DRY_RUN: ${{ inputs.heal_dry_run }}

        run: |
          set -o pipefail
          ARGS=""
          if [ "$FAIL_ON_FINDINGS" = "true" ]; then ARGS="--fail-on-findings"; fi
          if [ "$HEAL_DURABLE_TTL" = "true" ]; then
            ARGS="$ARGS --heal-durable-ttl"
          fi
          if [ "$HEAL_TTL_LEAKS" = "true" ]; then
            ARGS="$ARGS --heal-ttl-leaks"
          fi
          if [ "$HEAL_DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          set +e
          python3 src/redis_audit.py $ARGS | tee audit.txt
          RC=${PIPESTATUS[0]}
          set -e
          {
            echo "## 🔎 Redis key & TTL audit"
            echo '```'
            cat audit.txt

            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $RC

      - name: 📨 Notify Telegram on Redis audit failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG="🟠 Redis audit workflow FAILED"$'\n'"Run: ${RUN_URL}"
          RESP=$(curl -sS --max-time 20 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" || true)
          if echo "$RESP" | grep -q '"ok":true'; then
            echo "Telegram notify delivered"
          else
            echo "::warning::Failure notice NOT delivered: ${RESP:0:200}"
          fi