name: 🔎 Redis Key & TTL Audit

# Default: read-only SCAN / TYPE / TTL / XLEN / MEMORY USAGE.
# Optional --heal-leaks: EXPIRE ttl_required keys that have no TTL (ops only).
on:
  workflow_dispatch:
    inputs:
      fail_on_findings:
        description: 'Fail the job if the audit reports a warning/error finding'
        required: false
        default: false
        type: boolean
      heal_leaks:
        description: 'EXPIRE no-TTL keys in ttl_required families (writes to Redis)'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'With heal_leaks: show keys only, do not EXPIRE'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install redis client
        run: pip install --quiet redis==5.2.1

      - name: Run audit
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          FAIL_ON_FINDINGS: ${{ inputs.fail_on_findings }}
          HEAL_LEAKS: ${{ inputs.heal_leaks }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -o pipefail
          ARGS=""
          if [ "$FAIL_ON_FINDINGS" = "true" ]; then ARGS="$ARGS --fail-on-findings"; fi
          if [ "$HEAL_LEAKS" = "true" ]; then
            ARGS="$ARGS --heal-leaks"
            if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          fi
          set +e
          python3 src/redis_audit.py $ARGS | tee audit.txt
          RC=${PIPESTATUS[0]}
          set -e
          {
            echo "## 🔎 Redis key & TTL audit"
            if [ "$HEAL_LEAKS" = "true" ]; then
              echo ""
              echo "Mode: heal_leaks (dry_run=${DRY_RUN})"
            fi
            echo '```'
            cat audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $RC