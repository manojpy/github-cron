name: 🔎 Redis Key & TTL Audit

# Read-only by default. Runs src/redis_audit.py (SCAN / TYPE / TTL / XLEN /
# MEMORY USAGE only) against the REDIS_URL secret and prints the report in the
# job summary. With the toggles below left off it never writes, deletes or
# expires a key, so it is safe to run any time, including while the bot runs.
#
# One-off heal: tick `heal_durable_ttl` to raise the standing-decision keys
# (config_override, brain_disabled_alert_keys, brain_alert_key_history,
# pair_confluence_thresholds) that are still on the old 7-day TTL up to 90 days.
# It only ever lengthens a TTL (EXPIRE ... GT), changes no value, and skips
# dynamic_weights / brain_apply_snapshots. Tick `heal_dry_run` as well to
# preview without writing. Safe to run again: a healed key is simply skipped.
on:
  workflow_dispatch:
    inputs:
      fail_on_findings:
        description: 'Fail the job if the audit reports a warning/error finding'
        required: false
        default: false
        type: boolean
      heal_durable_ttl:
        description: 'ONE-OFF WRITE: raise old 7-day TTLs on standing-decision keys to 90 days'
        required: false
        default: false
        type: boolean
      heal_dry_run:
        description: 'With heal_durable_ttl: only show what would change, write nothing'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install redis client
        run: pip install --quiet redis==5.2.1

      - name: Run audit
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          FAIL_ON_FINDINGS: ${{ inputs.fail_on_findings }}
          HEAL_DURABLE_TTL: ${{ inputs.heal_durable_ttl }}
          HEAL_DRY_RUN: ${{ inputs.heal_dry_run }}
        run: |
          set -o pipefail
          ARGS=""
          if [ "$FAIL_ON_FINDINGS" = "true" ]; then ARGS="--fail-on-findings"; fi
          if [ "$HEAL_DURABLE_TTL" = "true" ]; then
            ARGS="$ARGS --heal-durable-ttl"
            if [ "$HEAL_DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          fi
          set +e
          python3 src/redis_audit.py $ARGS | tee audit.txt
          RC=${PIPESTATUS[0]}
          set -e
          {
            echo "## 🔎 Redis key & TTL audit"
            echo '```'
            cat audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $RC
