name: 🚨 MACD Bot Watchdog

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  MAX_SILENCE_MIN: 40
  LEARN_MAX_AGE_MIN: 480

jobs:
  watchdog:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 🔍 Check run-bot.yml health
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          set -uo pipefail
          REPO="${{ github.repository }}"

          if ! LATEST_JSON=$(gh api "repos/${REPO}/actions/workflows/run-bot.yml/runs?per_page=1"); then
            {
              echo "send_alert=true"
              echo "alert_msg<<EOF"
              echo "⚠️ Watchdog could not query GitHub Actions (gh api failed) — bot health unknown"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LATEST_STATUS=$(echo "$LATEST_JSON" | jq -r '.workflow_runs[0].status // "none"')
          LATEST_CONCLUSION=$(echo "$LATEST_JSON" | jq -r '.workflow_runs[0].conclusion // "none"')
          LATEST_CREATED=$(echo "$LATEST_JSON" | jq -r '.workflow_runs[0].created_at // "none"')
          LATEST_URL=$(echo "$LATEST_JSON" | jq -r '.workflow_runs[0].html_url // "none"')

          echo "Latest run → status=$LATEST_STATUS conclusion=$LATEST_CONCLUSION created=$LATEST_CREATED"

          if ! SUCCESS_JSON=$(gh api "repos/${REPO}/actions/workflows/run-bot.yml/runs?status=success&per_page=1"); then
            {
              echo "send_alert=true"
              echo "alert_msg<<EOF"
              echo "⚠️ Watchdog could not read the last successful run (gh api failed) — bot health unknown"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_SUCCESS=$(echo "$SUCCESS_JSON" | jq -r '.workflow_runs[0].created_at // empty')

          NOW_EPOCH=$(date -u +%s)
          if [ -n "$LAST_SUCCESS" ]; then
            SUCCESS_EPOCH=$(date -u -d "$LAST_SUCCESS" +%s)
            AGE_MIN=$(( (NOW_EPOCH - SUCCESS_EPOCH) / 60 ))
          else
            AGE_MIN=999999
          fi
          echo "Minutes since last successful run: $AGE_MIN"

          ALERT=""

          # Age of the latest run. A failed run already sent its own Telegram
          # failure notice, so only repeat it while it is fresh; an old failure
          # with no newer success is covered by the silence alert below.
          LATEST_AGE_MIN=0
          if [ "$LATEST_CREATED" != "none" ]; then
            LATEST_AGE_MIN=$(( (NOW_EPOCH - $(date -u -d "$LATEST_CREATED" +%s)) / 60 ))
          fi

          if [ "$LATEST_AGE_MIN" -le "${MAX_SILENCE_MIN}" ] \
             && [ "$LATEST_STATUS" = "completed" ] && [ "$LATEST_CONCLUSION" != "success" ] \
             && [ "$LATEST_CONCLUSION" != "cancelled" ] && [ "$LATEST_CONCLUSION" != "skipped" ]; then
            ALERT="⚠️ Latest run-bot.yml run finished with conclusion: ${LATEST_CONCLUSION}"$'\n'"Run: ${LATEST_URL}"
          fi

          # Alert on first detection (40-69 min), then about every 2 hours instead of every 30 min.
          if [ "$AGE_MIN" -ge "${MAX_SILENCE_MIN}" ] && { [ "$AGE_MIN" -lt 70 ] || [ $(( AGE_MIN / 30 % 4 )) -eq 0 ]; }; then
            SILENCE="🚨 No successful MACD Bot run in ${AGE_MIN} min (expected every ~15 min)"$'\n'"Last success: ${LAST_SUCCESS:-never recorded}"$'\n'"Latest run seen: ${LATEST_URL} (status=${LATEST_STATUS}, conclusion=${LATEST_CONCLUSION})"
            if [ -n "$ALERT" ]; then
              ALERT="${ALERT}"$'\n\n'"${SILENCE}"
            else
              ALERT="$SILENCE"
            fi
          fi

          # ── Learner heartbeat (F-10): learning halts silently if the Cronjobs.org
          # job stops dispatching learner.yml. Both live vetoes fail open after
          # PLAYBOOK_MAX_AGE_HOURS, so suppression degrades with no signal at all.
          if LEARN_JSON=$(gh api "repos/${REPO}/actions/workflows/learner.yml/runs?status=success&per_page=1"); then
            LEARN_SUCCESS=$(echo "$LEARN_JSON" | jq -r '.workflow_runs[0].created_at // empty')
            if [ -n "$LEARN_SUCCESS" ]; then
              LEARN_AGE_MIN=$(( (NOW_EPOCH - $(date -u -d "$LEARN_SUCCESS" +%s)) / 60 ))
            else
              LEARN_AGE_MIN=999999
            fi
            echo "Minutes since last successful learner run: $LEARN_AGE_MIN"
            if [ "$LEARN_AGE_MIN" -ge "${LEARN_MAX_AGE_MIN}" ] \
               && { [ "$LEARN_AGE_MIN" -lt 540 ] || [ $(( LEARN_AGE_MIN / 30 % 4 )) -eq 0 ]; }; then
              LEARN_ALERT="🧠 Learner stale: no successful learner.yml run in ${LEARN_AGE_MIN} min (expected every ~6 h). Playbook + hypothesis vetoes fail open after 36 h — suppression is degrading silently. Check the Cronjobs.org learner job."
              if [ -n "$ALERT" ]; then
                ALERT="${ALERT}"$'\n\n'"${LEARN_ALERT}"
              else
                ALERT="$LEARN_ALERT"
              fi
            fi
          else
            echo "::warning::Could not query learner.yml runs"
          fi

          if [ -n "$ALERT" ]; then
            {
              echo "send_alert=true"
              echo "alert_msg<<EOF"
              echo "$ALERT"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "✅ Bot healthy — last success ${AGE_MIN} min ago"
            echo "send_alert=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 🧠 Verify persisted learner artifacts (Redis)
        id: artifacts
        continue-on-error: true
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: |
          python3 -m venv /tmp/wdvenv
          /tmp/wdvenv/bin/pip install --quiet redis
          /tmp/wdvenv/bin/python - <<'PY'
          import json, os, time
          import redis
          out = os.environ["GITHUB_OUTPUT"]
          msgs = []
          try:
              r = redis.Redis.from_url(os.environ["REDIS_URL"], socket_timeout=10, socket_connect_timeout=10)
              now = time.time()
              raw = r.get("metadata:playbook_current")
              if not raw:
                  msgs.append("🧠 Playbook artifact MISSING in Redis (metadata:playbook_current) — learner runs may be green but its writes are not landing.")
              else:
                  age_h = (now - float(json.loads(raw).get("generated_ts") or 0)) / 3600.0
                  print(f"playbook artifact age: {age_h:.1f} h")
                  if age_h > 36:
                      msgs.append(f"🧠 Playbook artifact STALE: generated {age_h:.1f} h ago (> 36 h). A successful learner.yml run is not proof of a persisted playbook — check the learner's Redis write step.")
              ttl = r.ttl("metadata:pair_key_ev")
              print(f"pair_key_ev TTL: {ttl}")
              if ttl == -2:
                  print("::warning::pair_key_ev table missing/expired — runtime EV evidence falls back to pooled verdicts until the next 12 h Brain report")
          except Exception as e:
              print(f"::warning::artifact check could not reach Redis: {e!r}")
          with open(out, "a") as f:
              if msgs:
                  f.write("send_alert=true\n")
                  f.write("alert_msg<<EOF\n\n" + "\n\n".join(msgs) + "\nEOF\n")
              else:
                  f.write("send_alert=false\n")
          PY

      - name: 📨 Send Telegram Alert
        if: steps.check.outputs.send_alert == 'true' || steps.artifacts.outputs.send_alert == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_MSG: "${{ steps.check.outputs.alert_msg }}${{ steps.artifacts.outputs.alert_msg }}"
        run: |
          RESP=$(curl -sS --max-time 20 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${ALERT_MSG}" || true)
          if echo "$RESP" | grep -q '"ok":true'; then
            echo "Telegram notify delivered"
          else
            echo "::error::Watchdog alert NOT delivered: ${RESP:0:200}"
            exit 1
          fi

      - name: 📋 Summary
        if: always()
        run: |
          echo "## 🚨 Watchdog Check" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check.outputs.send_alert }}" = "true" ] || [ "${{ steps.artifacts.outputs.send_alert }}" = "true" ]; then
            echo "**Alert sent** — see Telegram" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No issues detected" >> $GITHUB_STEP_SUMMARY
          fi
