name: 📦 Dependency Check

# Weekly (called by Cronjobs.org via workflow_dispatch), read-only. Runs scripts/check_updates.py, then keeps ONE GitHub issue
# up to date with what could be bumped (and pings Telegram when that list changes).
# It never edits a file or opens a pull request: you decide what to change.
on:
  workflow_dispatch:

concurrency:
  group: dependency-check
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install checker dependency
        run: python -m pip install --disable-pip-version-check packaging

      - name: 🔎 Look for newer stable versions
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_updates.py --report update_report.md

      - name: 📝 Keep the dependency issue up to date
        id: issue
        env:
          HAS_UPDATES: ${{ steps.check.outputs.has_updates }}
          COUNT: ${{ steps.check.outputs.count }}
          FAILED: ${{ steps.check.outputs.failed }}
        run: |
          LABEL="dependency-update"
          TITLE="📦 Dependency updates available"
          gh label create "$LABEL" --color 0E8A16 --description "Automated dependency report" 2>/dev/null || true
          NUM=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number // empty')
          CHANGED=false

          if [ "$HAS_UPDATES" = "true" ]; then
            if [ -n "$NUM" ]; then
              # The first line carries the date; ignore it when deciding whether anything changed.
              OLD=$(gh issue view "$NUM" --json body --jq .body | tail -n +2 | tr -d '\r')
              NEW=$(tail -n +2 update_report.md | tr -d '\r')
              if [ "$OLD" != "$NEW" ]; then
                gh issue edit "$NUM" --title "$TITLE" --body-file update_report.md
                CHANGED=true
              fi
            else
              URL=$(gh issue create --title "$TITLE" --label "$LABEL" --body-file update_report.md)
              NUM="${URL##*/}"
              CHANGED=true
            fi
          elif [ "${FAILED:-0}" != "0" ]; then
            # Some checks could not run, so an empty list proves nothing: leave the issue as it is.
            echo "::warning::${FAILED} check(s) failed - not closing the dependency issue"
          elif [ -n "$NUM" ]; then
            gh issue close "$NUM" --comment "Nothing left to update as of $(date -u +%F)."
          fi
          echo "number=${NUM}" >> "$GITHUB_OUTPUT"
          echo "changed=${CHANGED}" >> "$GITHUB_OUTPUT"
          cat update_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: 📨 Tell me on Telegram (list changed, or check incomplete)
        if: steps.issue.outputs.changed == 'true' || steps.check.outputs.failed != '0'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COUNT: ${{ steps.check.outputs.count }}
          FAILED: ${{ steps.check.outputs.failed }}
          NUM: ${{ steps.issue.outputs.number }}
        run: |
          if [ "${FAILED:-0}" != "0" ]; then
            MSG="⚠️ Dependency check INCOMPLETE: ${FAILED} check(s) failed"$'\n'"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            MSG="📦 Dependency check: ${COUNT} item(s) need a decision"$'\n'"${{ github.server_url }}/${{ github.repository }}/issues/${NUM}"
          fi
          RESP=$(curl -sS --max-time 20 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" || true)
          if echo "$RESP" | grep -q '"ok":true'; then
            echo "Telegram notify delivered"
          else
            echo "::warning::Telegram notice NOT delivered: ${RESP:0:200}"
          fi
