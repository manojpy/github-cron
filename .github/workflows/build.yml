name: Build AOT Image (Optimized Hybrid)

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - 'setup.py'
      - '.github/workflows/build.yml'
  schedule:
    - cron: "0 2 * * 0"  # Weekly security rebuild
    - cron: "0 3 * * *"  # Daily Brain-only analysis (3 AM UTC)
  workflow_dispatch:
    inputs:
      skip_trivy:
        description: 'Skip Trivy scan (faster build)'
        required: false
        default: 'false'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/macd-unified-aot
  PYTHON_VERSION: "3.11"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      # PHASE 1: SETUP
      - name: 🔥 Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: 🐍 Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🔎 Type Check (mypy, informational)
        id: mypy
        continue-on-error: true
        run: |
          pip install --quiet mypy==1.14.1
          pip install --quiet -r requirements.txt
          echo "## 🔎 mypy Type Check" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
           mypy src/macd_unified.py src/aot_bridge.py src/numeric_selftest.py \
             src/bot_config.py src/state.py src/fetcher.py src/indicators.py \
             src/gates.py src/alerts.py src/threshold_engine.py src/brain.py src/brain_enhanced.py src/brain_audit.py src/outcome_storage.py \
             src/apply_config_override.py src/archive_reader.py src/repair_ledger.py \
            --ignore-missing-imports 2>&1 | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "ℹ️ Non-blocking for now -- see PR description before flipping to blocking." >> $GITHUB_STEP_SUMMARY

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            image=moby/buildkit:latest
          buildkitd-flags: --allow-insecure-entitlement network.host

      - name: 🔐 Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=schedule,pattern={{date 'YYYYMMDD-HHmm'}},enable=true
          labels: |
            org.opencontainers.image.title=MACD Unified Bot
            org.opencontainers.image.description=AOT-compiled trading alert bot
            maintainer=${{ github.actor }}

      # PHASE 2: BUILD & VERIFY
      - name: 🔨 Build & Push Docker Image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          outputs: type=image,compression=zstd,force-compression=true,push=true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |        
            CYTHON_STRICT=1
          cache-from: |
            type=gha,scope=macd-aot-build
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-to: type=gha,mode=max,scope=macd-aot-build
          provenance: false

      - name: ✅ Smoke Test - Verify AOT/JIT Configuration
        env:
          REQUIRE_AOT: true
        run: |
          echo "🧪 Running AOT verification..."
          docker run --rm -i --platform linux/amd64 \
            -e PYTHONPATH=/app/src \
            -e TZ=Asia/Kolkata \
            -e REQUIRE_AOT=${{ env.REQUIRE_AOT }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            python << 'EOF'
          import sys
          import os
          import traceback 

          try:
              from aot_bridge import is_using_aot, get_fallback_reason
        
              if is_using_aot():
                  print('✅ AOT Binary: LOADED & ACTIVE')
                  sys.exit(0)
              else:
                  reason = get_fallback_reason() or 'Unknown'
                  print(f'⚠️ AOT not available: {reason}')
            
                  if os.getenv('REQUIRE_AOT', 'false').lower() == 'true':
                      print('❌ REQUIRE_AOT=true: AOT compilation is mandatory')
                      sys.exit(1)
                  else:
                      print('⚠️ JIT fallback enabled')
                      sys.exit(0)
                
          except ImportError as e:
              print(f'❌ FAILED: Cannot import aot_bridge: {e}')
              sys.exit(1)
          except Exception as e:
              print(f'❌ FAILED: {e}')
              traceback.print_exc()
              sys.exit(1)
          EOF

      - name: ✅ Verify Required Files in Image
        run: |
          docker run --rm --platform linux/amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            bash -c '
              FILES=(
                "/app/src/macd_unified.py"
                "/app/src/aot_bridge.py"
                "/app/src/aot_meta.py"
                "/app/src/numba_functions_shared.py"
                "/app/src/numeric_selftest.py"
                "/app/src/bot_config.py"
                "/app/src/state.py"
                "/app/src/fetcher.py"
                "/app/src/indicators.py"
                "/app/src/gates.py"
                "/app/src/alerts.py"
                "/app/src/threshold_engine.py"        
                "/app/src/brain.py"
                "/app/src/brain_enhanced.py"   
                "/app/src/brain_audit.py" 
                "/app/src/repair_ledger.py"
                "/app/src/apply_config_override.py" 
                "/app/src/outcome_storage.py"
                "/app/src/archive_reader.py"
                "/app/src/cython_functions*.so"
              )
              for file in "${FILES[@]}"; do
                if ! compgen -G "$file" > /dev/null; then
                  echo "❌ MISSING: $file"
                  exit 1
                fi
                echo "✅ Found: $file"
              done
            '

      # PHASE 3: SECURITY SCANNING
      - name: 🛡️ Run Trivy Vulnerability Scan
        if: inputs.skip_trivy != 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: 📤 Upload Trivy Results to GitHub Security
        if: success() && inputs.skip_trivy != 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'container-security'

      # PHASE 4: BUILD SUMMARY
      - name: 📋 Generate Build Summary
        if: always()
        run: |
          echo "## 🔨 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | ${{ job.status == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY

      # PHASE 5: CLEANUP
      - name: 🧹 Cleanup
        if: always()
        run: rm -f trivy-results.sarif

  # ═══════════════════════════════════════════════════════════════════
  #  BRAIN-ONLY CYCLE (Runs independently of the AOT build)
  # ═══════════════════════════════════════════════════════════════════
  brain-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.schedule == '0 3 * * *'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 📦 Clone FULL outcome data repository
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          git clone \
            "https://oauth2:${DATA_REPO_TOKEN}@github.com/manojpy/outcome-data.git" \
            outcome-data

      - name: 🧠 Run Brain-Only Analysis
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          DELTA_API_BASE: ${{ secrets.DELTA_API_BASE }}
          OUTCOME_DATA_DIR: outcome-data
          BRAIN_ARCHIVE_SHALLOW: "false"
        run: |
          pip install --quiet -r requirements.txt
          python src/macd_unified.py --brain-only

      - name: 📤 Persist Brain report (reports/ only)
        if: always()
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          cd outcome-data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f reports 2>/dev/null || true   # full clone here, so no --sparse needed
          if git diff --cached --quiet; then
            echo "No new Brain report to persist."
            exit 0
          fi
          git commit -m "chore: brain report $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # The alert and cleanup workflows also push here — rebase and retry.
          PUSH_URL="https://oauth2:${DATA_REPO_TOKEN}@github.com/manojpy/outcome-data.git"
          for attempt in 1 2 3 4 5; do
            if git push "$PUSH_URL" HEAD:main; then
              echo "✅ Brain report pushed (attempt ${attempt})"
              exit 0
            fi
            echo "::warning::Push rejected (attempt ${attempt}/5) — rebasing onto latest main"
            sleep $(( attempt * 2 + RANDOM % 3 ))
            if ! git pull --rebase --no-tags "$PUSH_URL" main; then
              echo "::error::Rebase conflict — aborting; Brain report NOT persisted"
              git rebase --abort 2>/dev/null || true
              exit 1
            fi
          done
          echo "::error::Could not push Brain report after 5 attempts"
          exit 1





  
          