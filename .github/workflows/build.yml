name: Build AOT Image (Optimized Hybrid)

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.github/workflows/build.yml'
  schedule:
    - cron: "0 2 * * 0"  # Weekly security rebuild
  workflow_dispatch:
    inputs:
      skip_trivy:
        description: 'Skip Trivy scan (faster build)'
        required: false
        default: 'false'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/macd-unified-aot
  PYTHON_VERSION: "3.11"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      # PHASE 1: SETUP
      - name: 🔥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host
          buildkitd-flags: --allow-insecure-entitlement network.host

      - name: 🔐 Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=schedule,pattern={{date 'YYYYMMDD-HHmm'}},enable=true
          labels: |
            org.opencontainers.image.title=MACD Unified Bot
            org.opencontainers.image.description=AOT-compiled trading alert bot
            maintainer=${{ github.actor }}

      # PHASE 2: BUILD & VERIFY
      - name: 🔨 Build & Push Docker Image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          outputs: type=image,compression=zstd,force-compression=true,push=true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            AOT_STRICT=0
          cache-from: |
            type=gha,scope=macd-aot-deps
            type=gha,scope=macd-aot-build
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-to: type=gha,mode=max,scope=macd-aot-build
          provenance: false

      - name: ✅ Smoke Test - Verify AOT/JIT Configuration
        env:
          REQUIRE_AOT: true
        run: |
          echo "🧪 Running AOT verification..."
          docker run --rm --platform linux/amd64 \
            -e PYTHONPATH=/app/src:$PYTHONPATH \
            -e TZ=Asia/Kolkata \
            -e REQUIRE_AOT=${{ env.REQUIRE_AOT }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            python << 'EOF'
          import sys
          import os
          import traceback 

          try:
              from aot_bridge import is_using_aot, get_fallback_reason
        
              if is_using_aot():
                  print('✅ AOT Binary: LOADED & ACTIVE')
                  sys.exit(0)
              else:
                  reason = get_fallback_reason() or 'Unknown'
                  print(f'⚠️ AOT not available: {reason}')
            
                  if os.getenv('REQUIRE_AOT', 'false').lower() == 'true':
                      print('❌ REQUIRE_AOT=true: AOT compilation is mandatory')
                      sys.exit(1)
                  else:
                      print('⚠️ JIT fallback enabled')
                      sys.exit(0)
                
          except ImportError as e:
              print(f'❌ FAILED: Cannot import aot_bridge: {e}')
              sys.exit(1)
          except Exception as e:
              print(f'❌ FAILED: {e}')
              traceback.print_exc()
              sys.exit(1)
          EOF

      - name: ✅ Verify Required Files in Image
        run: |
          FILES=(
            "/app/src/macd_unified.py"
            "/app/src/aot_bridge.py"
            "/app/src/numba_functions_shared.py"
            "/app/src/macd_aot_compiled.so"
            "/app/src/macd_aot_compiled.version"
          )
          
          for file in "${FILES[@]}"; do
            if docker run --rm --platform linux/amd64 \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
              test -f "$file"; then
              echo "✅ Found: $file"
            else
              echo "❌ MISSING: $file"
              exit 1
            fi
          done

      # PHASE 3: SECURITY SCANNING (FIXED VERSION)
      - name: 🛡️ Run Trivy Vulnerability Scan
        if: github.event.inputs.skip_trivy != 'true' && github.event_name == 'schedule'
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: 📤 Upload Trivy Results to GitHub Security
        if: success() && github.event.inputs.skip_trivy != 'true' && github.event_name == 'schedule'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'container-security'

      # PHASE 4: BUILD SUMMARY
      - name: 📋 Generate Build Summary
        if: always()
        run: |
          echo "## 🔨 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | ${{ job.status == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY

      # PHASE 5: CLEANUP
      - name: 🧹 Cleanup
        if: always()
        run: rm -f trivy-results.sarif