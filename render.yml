services:
  - type: cron
    name: macd-unified-bot-cron
    runtime: docker

    dockerfilePath: ./Dockerfile
    dockerContext: ./

    # ✅ Schedule: 1,16,31,46 minutes of every hour (every 15 minutes, offset by 1 min)
    schedule: "1,16,31,46 * * * *"

    region: singapore

    plan: starter

    # ✅ Prevent concurrent runs (critical for cron bot)
    concurrencyPolicy: forbid

    # ✅ Smart build filtering - rebuild only on code/config changes
    # ✅ Build filter: Only rebuild on code/config changes
    # Relies on .dockerignore and .gitignore for comprehensive ignore rules
    buildFilter:
      paths:
        - src/**
        - requirements.txt
        - Dockerfile
        - render.yml
      ignoredPaths:
        - config_macd.json  # Only ignore config file - everything else handled by .dockerignore/.gitignore

    # ✅ Docker execution
    dockerCommand: python macd_unified.py

    # ✅ Environment variables optimized for Render starter plan
    envVars:
      # Python optimization
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONOPTIMIZE
        value: "2"
      - key: PYTHONPATH
        value: "/app/src:$PYTHONPATH"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"

      # Timezone and system
      - key: TZ
        value: Asia/Kolkata

      # Numba and threading (optimized for Render's 1 vCPU)
      - key: NUMBA_NUM_THREADS
        value: "2"
      - key: OMP_NUM_THREADS
        value: "2"
      - key: NUMBA_CACHE_DIR
        value: "/tmp/numba_cache"
      - key: NUMBA_PARALLEL
        value: "true"

      # Memory limit (safe for Render starter ~500MB available)
      - key: MEMORY_LIMIT_BYTES
        value: "450000000"

      # Timeout settings
      - key: RUN_TIMEOUT_SECONDS
        value: "300"

      # Performance optimizations
      - key: SKIP_WARMUP
        value: "true"
      - key: NUMBA_WARNINGS
        value: "0"

      # Bot behavior
      - key: SEND_TEST_MESSAGE
        value: "false"
      - key: DEBUG_MODE
        value: "false"
      - key: DRY_RUN_MODE
        value: "false"

      # API settings
      - key: MAX_PARALLEL_FETCH
        value: "12"
      - key: HTTP_TIMEOUT
        value: "8"
      - key: PRODUCTS_CACHE_TTL
        value: "43200"
      - key: MAX_CANDLE_STALENESS_SEC
        value: "1200"
      - key: CANDLE_FETCH_RETRIES
        value: "2"

      # Secrets (do NOT set default values, only sync from Render secrets)
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: REDIS_URL
        sync: false
      - key: DELTA_API_BASE
        sync: false

    # ✅ Email notification on failure
    notifications:
      - event: failure
        channel: email

    # ✅ Auto-deploy on main branch push
    autoDeploy: true
    branch: main

    # ✅ Scaling - Render starter can only run 1 instance at a time
    scaling:
      minInstances: 0
      maxInstances: 1

    # ✅ Enhanced build command with better diagnostics
    buildCommand: |
      echo "🔨 Starting Render cron deployment..."
      echo "✅ BuildKit optimization: pip, uv, and numba caches enabled"
      echo "📊 Expected build time:"
      echo "   - First run: 2-3 minutes (all caches empty)"
      echo "   - Cached run: 45-60 seconds (with cache hits)"
      echo "⏰ Cron schedule: 1,16,31,46 * * * * (every 15 minutes)"
      echo "🌍 Region: Singapore"
      echo "💾 Memory: 450MB (Dockerfile limit)"

    # ✅ Enhanced pre-deploy validation
    preDeployCommand: |
      echo "🚀 Pre-deploy validation..."
      echo "---"
      
      # Check Python version
      python -c "import sys; print(f'✅ Python {sys.version}')"
      
      # Validate config JSON
      python -c "import json; json.load(open('config_macd.json'))" && echo "✅ config_macd.json is valid JSON" || { echo "❌ Invalid JSON in config_macd.json"; exit 1; }
      
      # Check required source files exist
      test -f src/macd_unified.py && echo "✅ src/macd_unified.py found" || { echo "❌ src/macd_unified.py missing"; exit 1; }
      test -f src/aot_bridge.py && echo "✅ src/aot_bridge.py found" || { echo "❌ src/aot_bridge.py missing"; exit 1; }
      test -f requirements.txt && echo "✅ requirements.txt found" || { echo "❌ requirements.txt missing"; exit 1; }
      
      # Check dependencies
      python -m pip list | grep -E "aiohttp|numba|redis|pydantic" > /dev/null && echo "✅ Core dependencies available" || echo "⚠️  Will install dependencies during build"
      
      echo "---"
      echo "✅ All pre-deploy checks passed!"